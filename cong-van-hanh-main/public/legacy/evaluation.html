<!doctype html>
<html lang="vi" data-rpc-endpoint="/api/evaluation/rpc">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#114c41">
    <title>Đánh giá Nhân sự · Thuận Việt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
  :root {
    --screen-gap: clamp(18px, 2.5vh, 28px);
    --panel-gap: clamp(24px, 3vw, 48px);
    --hero-radius: 34px;
    --card-radius: 36px;
    --surface-strong: rgba(255, 255, 255, 0.98);
    --line: rgba(34, 64, 57, 0.12);
    --text: #18342f;
    --muted: #62756f;
    --muted-strong: #506661;
    --accent: #ea6c2d;
    --accent-strong: #da5716;
    --accent-deep: #114c41;
    --shadow: 0 30px 70px rgba(17, 45, 39, 0.14);
    --shadow-soft: 0 18px 36px rgba(14, 30, 26, 0.12);
    --background-wash: linear-gradient(135deg, rgba(250, 244, 231, 0.92), rgba(236, 243, 237, 0.96));
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    min-height: 100%;
  }

  body {
    margin: 0;
    font-family: 'Be Vietnam Pro', sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top right, rgba(233, 108, 45, 0.08), transparent 28%),
      radial-gradient(circle at bottom left, rgba(17, 76, 65, 0.1), transparent 24%),
      #f2f1ec;
    overflow-x: hidden;
  }

  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(17, 76, 65, 0.24) transparent;
  }

  *::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }

  *::-webkit-scrollbar-track {
    background: transparent;
  }

  *::-webkit-scrollbar-thumb {
    border: 3px solid transparent;
    border-radius: 999px;
    background: rgba(17, 76, 65, 0.24);
    background-clip: content-box;
  }

  *::-webkit-scrollbar-thumb:hover {
    background: rgba(17, 76, 65, 0.34);
    background-clip: content-box;
  }

  body.dashboard-mode {
    overflow: hidden;
  }

  ::selection {
    background: rgba(234, 108, 45, 0.18);
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  .view-screen.is-hidden,
  .is-hidden {
    display: none !important;
  }

  .screen-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(360px, 47vw) minmax(320px, 1fr);
    gap: var(--panel-gap);
    padding: var(--screen-gap);
    align-items: center;
    position: relative;
    isolation: isolate;
  }

  .hero-panel {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    min-width: 0;
  }

  .hero-visual {
    width: 100%;
    height: calc(100vh - (var(--screen-gap) * 2));
    border-radius: var(--hero-radius);
    background:
      linear-gradient(155deg, rgba(12, 39, 34, 0.08), rgba(12, 39, 34, 0.28)),
      var(--warehouse-background-image) center center / cover no-repeat;
    box-shadow: var(--shadow);
  }

  .login-panel,
  .dashboard-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding-right: clamp(10px, 2vw, 24px);
  }

  .login-panel {
    align-items: flex-start;
    padding-top: clamp(18px, 5vh, 54px);
  }

  .login-card,
  .dashboard-card {
    width: min(100%, 620px);
    background: var(--background-wash);
    border: 1px solid rgba(255, 255, 255, 0.68);
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    padding: clamp(26px, 3vw, 44px);
    position: relative;
    overflow: hidden;
  }

  .login-card,
  .login-card .form-block,
  .login-card .field-group {
    overflow: visible;
  }

  .dashboard-card {
    width: min(100%, 860px);
    height: calc(100vh - (var(--screen-gap) * 2));
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow: hidden;
  }

  .login-card::before,
  .dashboard-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at top right, rgba(234, 108, 45, 0.12), transparent 32%),
      radial-gradient(circle at bottom left, rgba(17, 76, 65, 0.08), transparent 30%);
    pointer-events: none;
  }

  .brand-block,
  .form-block,
  .dashboard-header,
  .feature-groups,
  .dashboard-status {
    position: relative;
    z-index: 1;
  }

  .brand-block {
    display: grid;
    justify-items: center;
    gap: 12px;
    text-align: center;
    margin-bottom: clamp(28px, 4vw, 42px);
  }

  .brand-logo {
    width: clamp(188px, 19vw, 258px);
    max-width: 100%;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 16px 30px rgba(20, 48, 40, 0.12));
  }

  .brand-copy {
    display: grid;
    justify-items: center;
    gap: 16px;
  }

  .brand-kicker {
    margin: 2px 0 0;
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(1rem, 1.35vw, 1.16rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #d07b1f;
    text-align: left;
  }

  .brand-title {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(2.72rem, 4.9vw, 4.42rem);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -0.02em;
    color: var(--accent-deep);
    white-space: nowrap;
  }

  .form-block {
    background: rgba(255, 255, 255, 0.58);
    border: 1px solid rgba(255, 255, 255, 0.76);
    border-radius: 28px;
    padding: clamp(20px, 3vw, 30px);
    backdrop-filter: blur(16px);
  }

  #loginView.screen-shell {
    height: 100vh;
    height: 100dvh;
    min-height: 100vh;
    min-height: 100dvh;
    align-items: stretch;
    overflow: hidden;
  }

  #loginView .hero-panel,
  #loginView .login-panel {
    min-height: 0;
  }

  #loginView .hero-visual {
    height: 100%;
  }

  #loginView .login-panel {
    align-items: center;
    padding-top: 0;
  }

  #loginView .login-card {
    max-height: calc(100vh - (var(--screen-gap) * 2));
    max-height: calc(100dvh - (var(--screen-gap) * 2));
    padding: clamp(18px, 2vh, 28px) clamp(22px, 2.6vw, 36px);
  }

  #loginView .brand-block {
    gap: clamp(6px, 0.9vh, 10px);
    margin-bottom: clamp(12px, 2vh, 22px);
  }

  #loginView .brand-logo {
    width: clamp(144px, 13vw, 190px);
  }

  #loginView .brand-copy {
    gap: clamp(8px, 1.3vh, 12px);
  }

  #loginView .brand-title {
    font-size: clamp(2.12rem, 4.2vw, 3.55rem);
    line-height: 0.9;
  }

  #loginView .notifier-promo-card {
    width: min(100%, 360px);
    grid-template-columns: minmax(0, 1fr) auto;
    padding: 10px 12px;
    border-radius: 18px;
  }

  #loginView .notifier-promo-brand {
    gap: 8px;
  }

  #loginView .notifier-promo-icon-shell {
    width: 38px;
    height: 38px;
    border-radius: 0;
  }

  #loginView .notifier-promo-action {
    border-radius: 12px;
  }

  #loginView .form-block {
    padding: clamp(14px, 2vh, 20px) clamp(18px, 2.2vw, 24px);
    border-radius: 24px;
  }

  #loginView .login-form {
    gap: clamp(10px, 1.35vh, 14px);
  }

  #loginView .field-group {
    gap: 7px;
  }

  #loginView .field-label {
    font-size: 0.86rem;
  }

  #loginView .text-input,
  #loginView .select-input {
    min-height: 48px;
    border-radius: 15px;
  }

  #loginView .primary-button {
    min-height: 50px;
    border-radius: 15px;
  }

  #loginView .combobox-toggle.ui-combobox-toggle {
    right: 8px;
    width: 32px;
    height: 32px;
    border-radius: 12px;
  }

  .notifier-promo-card {
    position: relative;
    width: min(100%, 388px);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "content action";
    column-gap: 14px;
    align-items: center;
    padding: 12px 14px;
    border-radius: 20px;
    border: 1px solid rgba(17, 76, 65, 0.1);
    background: rgba(255, 255, 255, 0.7);
    box-shadow:
      0 16px 32px rgba(17, 45, 39, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.62);
    backdrop-filter: blur(18px);
    color: inherit;
    text-decoration: none;
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease, background 0.22s ease;
  }

  .notifier-promo-card:hover,
  .notifier-promo-card:focus-visible,
  .notifier-promo-card:focus-within {
    transform: translateY(-1px);
    border-color: rgba(17, 76, 65, 0.14);
    box-shadow:
      0 22px 38px rgba(17, 45, 39, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.64);
    background: rgba(255, 255, 255, 0.82);
  }

  .notifier-promo-card:focus-visible {
    outline: none;
  }

  .notifier-promo-card.is-disabled {
    cursor: default;
  }

  .notifier-promo-card.is-disabled:hover {
    transform: none;
    border-color: rgba(17, 76, 65, 0.1);
    box-shadow:
      0 16px 32px rgba(17, 45, 39, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.62);
    background: rgba(255, 255, 255, 0.7);
  }

  .notifier-promo-main {
    grid-area: content;
    min-width: 0;
    display: grid;
    gap: 2px;
    align-content: center;
    text-align: left;
  }

  .notifier-promo-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .notifier-promo-icon-shell {
    width: 44px;
    height: 44px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border-radius: 0;
    background: transparent;
    border: 0;
    box-shadow: none;
    overflow: hidden;
  }

  .notifier-promo-icon-shell--fallback {
    color: var(--accent-deep);
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;
    font-weight: 800;
  }

  .notifier-promo-icon {
    width: 42px;
    height: 42px;
    display: block;
    object-fit: contain;
  }

  .notifier-promo-copy {
    min-width: 0;
    display: grid;
    gap: 2px;
  }

  .notifier-promo-kicker {
    color: #986c3b;
    font-size: 0.58rem;
    font-style: italic;
    font-weight: 700;
    line-height: 1.2;
  }

  .notifier-promo-title {
    color: var(--accent-deep);
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: clamp(0.98rem, 1.42vw, 1.12rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
  }

  .notifier-promo-action {
    grid-area: action;
    display: grid;
    place-items: center;
    min-height: 100%;
    border-left: 1px solid rgba(17, 76, 65, 0.06);
    border-radius: 14px;
    color: #ffffff;
    background: linear-gradient(135deg, rgba(234, 108, 45, 0.9), rgba(218, 87, 22, 0.96));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.22),
      0 10px 22px rgba(218, 87, 22, 0.2);
  }

  .notifier-promo-card.is-disabled .notifier-promo-action {
    background: rgba(17, 76, 65, 0.12);
    color: rgba(17, 76, 65, 0.56);
  }

  .notifier-promo-action svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.25;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .notifier-download-options {
    grid-area: action;
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    min-height: 0;
  }

  .notifier-download-option {
    min-width: 0;
    width: 40px;
    height: 40px;
    min-height: 40px;
    display: grid;
    place-items: center;
    align-content: center;
    padding: 0;
    border-radius: 12px;
    border: 0;
    background: transparent;
    color: var(--accent-deep);
    box-shadow: none;
    text-decoration: none;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  }

  .notifier-download-option:hover,
  .notifier-download-option:focus-visible {
    transform: translateY(-1px);
    background: rgba(234, 108, 45, 0.12);
    box-shadow: none;
    outline: none;
  }

  .notifier-download-option.is-disabled {
    cursor: default;
    pointer-events: none;
    background: transparent;
    color: rgba(38, 70, 64, 0.55);
    box-shadow: none;
  }

  .notifier-download-option svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .notifier-download-option svg rect {
    fill: none;
  }

  .notifier-download-os {
    display: none;
  }

  .notifier-download-soon {
    display: none;
  }

  .notifier-promo-sub {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: calc(100% + 10px);
    opacity: 0;
    padding: 10px 12px;
    border-radius: 14px;
    border: 1px solid rgba(17, 76, 65, 0.08);
    background: rgba(255, 255, 255, 0.86);
    box-shadow: 0 18px 34px rgba(17, 45, 39, 0.1);
    color: rgba(38, 70, 64, 0.78);
    font-size: 0.76rem;
    line-height: 1.45;
    text-align: left;
    pointer-events: none;
    transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 4;
  }

  .notifier-promo-card:hover .notifier-promo-sub,
  .notifier-promo-card:focus-visible .notifier-promo-sub,
  .notifier-promo-card:focus-within .notifier-promo-sub {
    opacity: 1;
    transform: translateY(0);
  }

  .notifier-pair-launch-button {
    padding: 0;
    overflow: hidden;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.84), rgba(245, 247, 245, 0.7));
  }

  .notifier-pair-launch-button:hover {
    background: rgba(255, 255, 255, 0.9);
  }

  .notifier-pair-launch-icon {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  .notifier-pair-launch-fallback {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.92rem;
    font-weight: 800;
    color: var(--accent-deep);
  }

  .notifier-pair-dialog {
    width: min(92vw, 640px);
  }

  .notifier-pair-shell {
    display: grid;
    gap: 18px;
  }

  .notifier-pair-brand-card,
  .notifier-pair-code-card {
    display: grid;
    gap: 14px;
    padding: 18px;
    border-radius: 24px;
    border: 1px solid rgba(17, 76, 65, 0.1);
    background: rgba(255, 255, 255, 0.72);
    box-shadow: 0 18px 34px rgba(17, 45, 39, 0.08);
    backdrop-filter: blur(16px);
  }

  .notifier-pair-brand-card {
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 16px;
  }

  .notifier-pair-brand-mark {
    width: 78px;
    height: 78px;
    display: grid;
    place-items: center;
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(246, 248, 246, 0.86));
    border: 1px solid rgba(17, 76, 65, 0.08);
    box-shadow: 0 14px 28px rgba(17, 45, 39, 0.1);
    overflow: hidden;
  }

  .notifier-pair-brand-mark--fallback {
    color: var(--accent-deep);
    font-family: 'Montserrat', sans-serif;
    font-size: 1.2rem;
    font-weight: 800;
  }

  .notifier-pair-brand-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  .notifier-pair-brand-copy {
    min-width: 0;
    display: grid;
    gap: 6px;
  }

  .notifier-pair-brand-kicker {
    margin: 0;
    font-size: 0.72rem;
    font-style: italic;
    font-weight: 600;
    line-height: 1.2;
    color: #986c3b;
  }

  .notifier-pair-brand-title {
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: clamp(1.34rem, 2.2vw, 1.9rem);
    font-weight: 700;
    line-height: 1.08;
    color: var(--accent-deep);
    letter-spacing: -0.04em;
  }

  .notifier-pair-download-options {
    display: grid;
    grid-template-columns: repeat(2, 58px);
    gap: 8px;
    justify-self: end;
  }

  .notifier-pair-download-button {
      width: 58px;
      min-width: 58px;
      height: 58px;
      min-height: 58px;
      padding: 6px 4px;
      display: inline-grid;
      align-items: center;
      justify-content: center;
      justify-items: center;
      align-content: center;
      justify-self: end;
      gap: 2px;
      border-radius: 20px;
      background: rgba(17, 76, 65, 0.08);
      border-color: rgba(17, 76, 65, 0.1);
      color: var(--accent-deep);
      box-shadow: 0 14px 26px rgba(17, 45, 39, 0.08);
    }

    .notifier-pair-download-button:hover,
    .notifier-pair-download-button:focus-visible {
      background: rgba(17, 76, 65, 0.12);
      border-color: rgba(17, 76, 65, 0.2);
      transform: translateY(-1px);
    }

    .notifier-pair-download-button.is-disabled {
      cursor: default;
      pointer-events: none;
      background: rgba(17, 76, 65, 0.05);
      border-color: rgba(17, 76, 65, 0.08);
      color: rgba(38, 70, 64, 0.56);
      box-shadow: none;
    }

    .notifier-pair-download-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .notifier-pair-download-button svg rect {
      fill: none;
    }

    .notifier-pair-download-os,
    .notifier-pair-download-soon {
      color: currentColor;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-weight: 800;
      line-height: 1;
      text-align: center;
    }

    .notifier-pair-download-os {
      font-size: 0.58rem;
    }

    .notifier-pair-download-soon {
      font-size: 0.43rem;
      line-height: 1.08;
    }

  .notifier-pair-code-head,
  .notifier-pair-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .notifier-pair-code-label {
    margin: 0;
  }

  .notifier-pair-refresh-button svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.1;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .notifier-pair-code-value {
    min-height: 84px;
    display: grid;
    place-items: center;
    padding: 0 18px;
    border-radius: 22px;
    background: linear-gradient(145deg, rgba(16, 64, 53, 0.06), rgba(234, 108, 45, 0.08));
    color: var(--accent-deep);
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: clamp(1.9rem, 4vw, 2.8rem);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: center;
  }

  .notifier-pair-expire {
    color: var(--muted-strong);
    font-size: 0.84rem;
    font-weight: 500;
    line-height: 1.45;
  }

  .notifier-pair-copy-button,
  .notifier-pair-open-button {
    min-width: 180px;
  }

  .notifier-pair-status {
    text-align: left;
  }

  .notifier-pair-status.is-error {
    color: #a03d29;
  }

  .notifier-pair-status.is-success {
    color: var(--accent-deep);
  }

  .notifier-pair-status.is-info {
    color: var(--muted-strong);
  }

  .form-header {
    margin-bottom: 22px;
  }

  .section-tag {
    margin: 0 0 10px;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.16em;
  }

  .login-form {
    display: grid;
    gap: 18px;
  }

  .field-group {
    display: grid;
    gap: 10px;
  }

  .field-group.is-hidden {
    display: none;
  }

  .field-label {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--accent-deep);
  }

  .form-message,
  .dashboard-status {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--muted);
  }

  .form-message:empty,
  .dashboard-status:empty {
    display: none;
  }

  .form-message.is-error,
  .dashboard-status.is-error {
    color: #b33a18;
  }

  .form-message.is-success,
  .dashboard-status.is-success {
    color: #0f6a56;
  }

  .dashboard-status.is-info {
    color: var(--muted-strong);
  }

  .select-shell {
    position: relative;
  }

  .toggle-switch input {

    inset: 0;

  .toggle-slider {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: rgba(216, 229, 224, 0.96);
    transition: background 0.22s ease, box-shadow 0.22s ease;
    box-shadow: inset 0 1px 2px rgba(17, 76, 65, 0.08);
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    top: 5px;
    left: 5px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 8px 18px rgba(17, 45, 39, 0.18);
    transition: transform 0.22s ease;
  }

  .toggle-switch input:checked + .toggle-slider {
    background: rgba(17, 76, 65, 0.2);
  }

  .toggle-switch input:checked + .toggle-slider::before {
    transform: translateX(36px);
  }

    if (normalize(raw) === 'vinh vien' || raw === 'permanent') return { amount: '', unit: 'month', permanent: true };
    try { return Object.assign(fallback, JSON.parse(raw)); } catch (_) {}
    var parts = raw.split(/[:|\s]+/);
    return { amount: parts[0] || '', unit: parts[1] || 'month', permanent: false };
  }
  function evaluationAddDuration(startValue, durationValue) {
    var start = trim(startValue);
    var duration = evaluationDecisionDuration(durationValue);
    if (duration.permanent) return 'Vĩnh viễn';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(start) || !Number(duration.amount)) return '';
    var date = new Date(start + 'T00:00:00.000Z');
    if (Number.isNaN(date.valueOf())) return '';
    if (duration.unit === 'day') date.setUTCDate(date.getUTCDate() + Number(duration.amount));
    if (duration.unit === 'month') date.setUTCMonth(date.getUTCMonth() + Number(duration.amount));
    if (duration.unit === 'year') date.setUTCFullYear(date.getUTCFullYear() + Number(duration.amount));
    return date.toISOString().slice(0, 10);
  }
  function evaluationDecisionRowValue(row) {
    var input = row && row.querySelector('[data-decision-value]');
    return input ? trim(input.value) : '';
  }
  function syncDecisionFieldUi() {
    var rows = $all('[data-decision-field-id]');
    rows.forEach(function (row) {
      if (normalize(row.getAttribute('data-decision-field-type')) !== 'multi_choice') return;
      var output = row.querySelector('[data-decision-value]');
      var selected = Array.prototype.slice.call(row.querySelectorAll('[data-decision-multi-option]:checked')).map(function (input) { return input.value; });
      if (output) output.value = JSON.stringify(selected);
    });
    rows.forEach(function (row) {
      if (normalize(row.getAttribute('data-decision-field-type')) !== 'duration') return;
      var amount = row.querySelector('[data-decision-duration-amount]');
      var unit = row.querySelector('[data-decision-duration-unit]');
      var permanent = row.querySelector('[data-decision-duration-permanent]');
      var output = row.querySelector('[data-decision-value]');
      if (amount) amount.disabled = !!(permanent && permanent.checked);
      if (unit) unit.disabled = !!(permanent && permanent.checked);
      if (output) output.value = permanent && permanent.checked ? 'permanent' : JSON.stringify({ amount: Number(amount && amount.value || 0), unit: unit && unit.value || 'month', permanent: false });
    });
    var values = {};
    rows.forEach(function (row) { values[row.getAttribute('data-decision-field-code')] = evaluationDecisionRowValue(row); });
    rows.forEach(function (row) {
      var dependsOn = trim(row.getAttribute('data-decision-depends-on'));
      var expected = trim(row.getAttribute('data-decision-depends-value'));
      if (!dependsOn) { row.hidden = false; return; }
      var conditionValues = evaluationDecisionConfiguredValues(row.getAttribute('data-decision-condition-values') || expected).map(evaluationDecisionComparable);
      var excludedValues = evaluationDecisionConfiguredValues(row.getAttribute('data-decision-condition-excluded')).map(evaluationDecisionComparable);
      var actualValues = evaluationDecisionAnswerValues(values[dependsOn]).map(evaluationDecisionComparable);
      var actual = {};
      actualValues.forEach(function (value) { actual[value] = true; });
      var excluded = excludedValues.some(function (value) { return actual[value]; });
      var matches = conditionValues.length
        ? (row.getAttribute('data-decision-condition-mode') === 'all'
          ? conditionValues.every(function (value) { return actual[value]; })
          : conditionValues.some(function (value) { return actual[value]; }))
        : actualValues.length > 0;
      row.hidden = excluded || !matches;
    });
    rows.forEach(function (row) {
      if (normalize(row.getAttribute('data-decision-field-type')) !== 'calculated_date') return;
      var output = row.querySelector('[data-decision-value]');
      if (!output) return;
      output.value = evaluationAddDuration(values[row.getAttribute('data-decision-calc-start')], values[row.getAttribute('data-decision-calc-duration')]);
      values[row.getAttribute('data-decision-field-code')] = output.value;
    });
  }

  function renderDecisionInput(field, value) {
    var type = normalize(field && field.fieldType) || 'text';
    var attrs = ' data-decision-value class="evaluation-input"';
    if (type === 'duration') {
      var duration = evaluationDecisionDuration(value);
      return '<div class="evaluation-duration-control"><input class="evaluation-input" type="number" min="1" step="1" data-decision-duration-amount value="' + escapeHtml(duration.amount || '') + '" placeholder="Số lượng">' +
        '<select class="evaluation-input" data-decision-duration-unit><option value="day"' + (duration.unit === 'day' ? ' selected' : '') + '>Ngày</option><option value="month"' + (duration.unit === 'month' ? ' selected' : '') + '>Tháng</option><option value="year"' + (duration.unit === 'year' ? ' selected' : '') + '>Năm</option></select>' +
        '<label class="evaluation-duration-permanent"><input type="checkbox" data-decision-duration-permanent' + (duration.permanent ? ' checked' : '') + '>Vĩnh viễn</label>' +
        '<input type="hidden" data-decision-value value="' + escapeHtml(value || '') + '"></div>';
    }
    if (type === 'calculated_date') {
      return '<input' + attrs + ' type="text" readonly value="' + escapeHtml(value || '') + '" placeholder="Hệ thống tự tính"><span class="evaluation-calculated-note">Tự tính từ ngày bắt đầu và thời hạn.</span>';
    }
    if (type === 'yes_no' || type === 'boolean') {
      return '<select' + attrs + '>' +
        '<option value=""></option>' +
        '<option value="yes"' + (value === 'yes' || value === 'Có' ? ' selected' : '') + '>Có</option>' +
        '<option value="no"' + (value === 'no' || value === 'Không' ? ' selected' : '') + '>Không</option>' +
      '</select>';
    }
    if (type === 'multi_choice' || type === 'multiselect') {
      var multiOptions = Array.isArray(field.options)
        ? field.options
        : Array.isArray(field.optionValues)
          ? field.optionValues
          : text(field.options || field.optionValues || field.choices).split(/[,;\n|]+/);
      var selectedValues = evaluationDecisionAnswerValues(value);
      var multiHtml = multiOptions.map(function (option) {
        var optionValue = trim(option && (option.value || option.label) || option);
        var optionLabel = trim(option && option.label || optionValue);
        if (!optionValue) return '';
        var checked = selectedValues.indexOf(optionValue) !== -1;
        return '<label class="evaluation-multi-choice-option"><input type="checkbox" data-decision-multi-option value="' + escapeHtml(optionValue) + '"' + (checked ? ' checked' : '') + '><span>' + escapeHtml(optionLabel) + '</span></label>';
      }).join('');
      return '<div class="evaluation-multi-choice">' + multiHtml + '</div><input type="hidden" data-decision-value value="' + escapeHtml(JSON.stringify(selectedValues)) + '">';
    }
    if (type === 'single_choice' || type === 'select') {
      var rawOptions = Array.isArray(field.options)
        ? field.options
        : Array.isArray(field.optionValues)
          ? field.optionValues
          : text(field.options || field.optionValues || field.choices).split(/[,;\n|]+/);
      var optionHtml = rawOptions.map(function (option) {
        var optionValue = trim(option && (option.value || option.label) || option);
        var optionLabel = trim(option && option.label || optionValue);
        if (!optionValue) return '';
        return '<option value="' + escapeHtml(optionValue) + '"' + (text(value) === optionValue ? ' selected' : '') + '>' + escapeHtml(optionLabel) + '</option>';
      }).join('');
      return '<select' + attrs + '><option value=""></option>' + optionHtml + '</select>';
    }
    if (type === 'long_text' || type === 'textarea') {
      return '<textarea data-decision-value class="evaluation-textarea">' + escapeHtml(value || '') + '</textarea>';
    }
    if (type === 'currency' || type === 'money') {
      return '<input' + attrs + ' type="number" min="0" step="100000" value="' + escapeHtml(value || '') + '">';
    }
    if (type === 'percent' || type === 'percentage') {
      return '<input' + attrs + ' type="number" min="0" max="100" step=".01" value="' + escapeHtml(value || '') + '">';
    }
    if (type === 'number') {
      return '<input' + attrs + ' type="number" step=".01" value="' + escapeHtml(value || '') + '">';
    }
    if (type === 'date') {
      return '<input' + attrs + ' type="date" value="' + escapeHtml(value || '') + '">';
    }
    return '<input' + attrs + ' type="text" value="' + escapeHtml(value || '') + '">';
  }
  function renderDecisionFields(instance, role) {
    var node = $('evaluationDecisionFields');
    if (!node) return;
    if (instance && (state.loadingInstanceId === String(instance.id || '') || !hasLoadedInstanceDetail(instance.id))) {
      node.innerHTML = '';
      node.classList.remove('is-visible');
      delete node.dataset.extraTotal;
      return;
    }
    var fields = decisionFieldsForInstance(instance, role);
    if (instance && normalizeRole(role) === 'indirect_manager') {
      fields = [
        { id: 'INDIRECT_MANAGER_DECISION', code: 'INDIRECT_MANAGER_DECISION', label: 'Xác nhận của Quản lý gián tiếp', fieldType: 'single_choice', options: [{ value: 'accepted', label: 'Đồng ý với đề xuất của QLTT' }, { value: 'adjustment', label: 'Có điều chỉnh đề xuất của QLTT' }, { value: 'rejected', label: 'Từ chối đề xuất của QLTT' }], isRequired: true, role: 'indirect_manager' },
        { id: 'INDIRECT_MANAGER_FEEDBACK', code: 'INDIRECT_MANAGER_FEEDBACK', label: 'Nội dung điều chỉnh / Lý do từ chối', fieldType: 'long_text', isRequired: true, role: 'indirect_manager', dependsOnFieldCode: 'INDIRECT_MANAGER_DECISION', dependsOnValue: 'adjustment|rejected' }
      ].concat(fields.filter(function (field) { return ['INDIRECT_MANAGER_DECISION','INDIRECT_MANAGER_FEEDBACK'].indexOf(text(field.code)) === -1; }));
    }
    if (instance && normalizeRole(role) === 'bod') {
      fields = [
        { id: 'BOD_DECISION', code: 'BOD_DECISION', label: 'Xác nhận của Ban giám đốc', fieldType: 'single_choice', options: [{ value: 'accepted', label: 'Chấp nhận' }, { value: 'adjustment', label: 'Điều chỉnh' }, { value: 'rejected', label: 'Từ chối' }], isRequired: true, role: 'bod' },
        { id: 'BOD_FEEDBACK', code: 'BOD_FEEDBACK', label: 'Nội dung điều chỉnh / Lý do từ chối', fieldType: 'long_text', isRequired: true, role: 'bod', dependsOnFieldCode: 'BOD_DECISION', dependsOnValue: 'adjustment|rejected' }
      ].concat(fields.filter(function (field) { return ['BOD_DECISION','BOD_FEEDBACK'].indexOf(text(field.code)) === -1; }));
    }
    if (!instance || !fields.length) {

    }
    node.classList.add('is-visible');
    node.dataset.extraTotal = String(fields.length);
    var answeredCount = fields.reduce(function (total, field) {
      return total + (trim(decisionValueForField(instance, field, role)) ? 1 : 0);
    }, 0);
    node.innerHTML = '<div class="evaluation-extra-section-head"><h4 class="evaluation-extra-title">Thông tin thêm</h4>' +
      '<div class="evaluation-extra-metrics">' +
        '<span class="evaluation-extra-pill is-strong" data-extra-answer-count>' + escapeHtml(answeredCount + '/' + fields.length + ' đã trả lời') + '</span>' +
        '<span class="evaluation-extra-pill">' + escapeHtml(fields.length + ' câu hỏi') + '</span>' +
      '</div></div><div class="evaluation-extra-body">' + fields.map(function (field) {
      var value = decisionValueForField(instance, field, role);
      var visibilityCondition = field.visibilityCondition && typeof field.visibilityCondition === 'object' ? field.visibilityCondition : {};
      var conditionValues = evaluationDecisionConfiguredValues(visibilityCondition.includeValues || field.conditionValues || field.dependsOnValue || field.showWhenValue || []);
      var conditionExcludedValues = evaluationDecisionConfiguredValues(visibilityCondition.excludeValues || field.conditionExcludedValues || []);
      var conditionMode = (visibilityCondition.matchMode || field.conditionMatchMode) === 'all' ? 'all' : 'any';
      var questionHtml = evaluationSanitizeQuestionHtml(field.labelHtml || field.fieldLabelHtml || '');
      return '<div class="evaluation-extra-row" data-decision-field-id="' + escapeHtml(field.id || '') + '" data-decision-field-code="' + escapeHtml(field.code || '') + '" data-decision-field-type="' + escapeHtml(field.fieldType || 'text') + '" data-decision-depends-on="' + escapeHtml(visibilityCondition.sourceFieldCode || field.dependsOnFieldCode || field.showWhenFieldCode || '') + '" data-decision-depends-value="' + escapeHtml(field.dependsOnValue || field.showWhenValue || '') + '" data-decision-condition-mode="' + escapeHtml(conditionMode) + '" data-decision-condition-values="' + escapeHtml(conditionValues.join('|')) + '" data-decision-condition-excluded="' + escapeHtml(conditionExcludedValues.join('|')) + '" data-decision-calc-start="' + escapeHtml(field.calculationStartFieldCode || field.startFieldCode || '') + '" data-decision-calc-duration="' + escapeHtml(field.calculationDurationFieldCode || field.durationFieldCode || '') + '">' +
        '<div class="evaluation-label evaluation-decision-question">' + (questionHtml || escapeHtml(field.label || field.name || field.code || 'Câu hỏi')) + (field.isRequired ? ' <span class="evaluation-required">*</span>' : '') + '</div>' +
        renderDecisionInput(field, value) +
      '</div>';
    }).join('') + '</div>';
    syncDecisionFieldUi();
  }
  function syncDecisionAnswerCount() {
    var node = $('evaluationDecisionFields');
    if (!node || !node.classList.contains('is-visible')) return;
    syncDecisionFieldUi();
    var fields = $all('[data-decision-field-id]').filter(function (row) { return !row.hidden; });
    var answeredCount = fields.reduce(function (total, row) { return total + (evaluationDecisionRowValue(row) ? 1 : 0); }, 0);
    node.dataset.extraTotal = String(fields.length);
    var countNode = node.querySelector('[data-extra-answer-count]');
    if (countNode) countNode.textContent = answeredCount + '/' + fields.length + ' đã trả lời';
  }
  function renderAll() {
    if (!hasSelectedInstance()) state.selectedInstanceId = '';
    renderTypeFilter();
    renderInstanceList();
    renderDetail();
  }
  function collectScores() {
    return $all('.evaluation-score-row').map(function (row) {
      var input = row.querySelector('[data-score-value]');
      var isEmpty = row.getAttribute('data-score-empty') === '1';
      return {
        id: row.getAttribute('data-score-id'),
        criteriaId: row.getAttribute('data-criteria-id'),
        score: isEmpty ? null : numValue(input && input.value),
        comment: trim(row.querySelector('[data-score-comment]').value)
      };
    });
  }
  function collectDecisionValues() {
    syncDecisionFieldUi();
    return $all('[data-decision-field-id]').filter(function (row) { return !row.hidden; }).map(function (row) {
      return {
        fieldId: row.getAttribute('data-decision-field-id'),
        fieldCode: row.getAttribute('data-decision-field-code'),
        fieldType: row.getAttribute('data-decision-field-type'),
        value: evaluationDecisionRowValue(row)
      };
    });
  }
  function submitReview(mode) {
    var instance = selectedInstance();
    if (!instance) {
      alertMessage('Chọn phiếu cần đánh giá trước nha.', 'Thiếu phiếu');
      return Promise.resolve(null);
    }
    var role = roleForInstance(instance);
    if (!canReviewInstance(instance, role)) {
      alertMessage('Phiếu này chưa tới lượt đánh giá của bạn hoặc đã hoàn tất/chốt kết quả.', 'Chưa thể cập nhật');
      return Promise.resolve(null);
    }
    var isDraft = mode === 'draft';
    return callWrite('saveEvaluationInstanceReview', {
      instanceId: String($('evaluationSelectedInstanceId').value || ''),
      assignmentId: instance.reviewAssignmentId || state.selectedAssignmentId || '',
      role: role,
      submissionMode: isDraft ? 'draft' : 'submit',
      comment: trim($('evaluationReviewComment').value),
      scores: collectScores(),
      decisionValues: collectDecisionValues()
    }, isDraft ? 'Đã lưu bản nháp.' : 'Đã gửi đánh giá.');

  function generateResultPdf() {
    var instance = selectedInstance();
    if (!instance) {
      alertMessage('Chọn phiếu cần tạo PDF trước nha.', 'Thiếu phiếu');
      return Promise.resolve(null);
    }
    if (normalize(instance.status) !== 'finalized') {
      alertMessage('Chỉ tạo PDF sau khi phiếu đã hoàn tất hoặc đã được chốt kết quả.', 'Chưa thể tạo PDF');
      return Promise.resolve(null);
    }
    if (!guardWrite()) return Promise.resolve(null);
    showWriteLoading('Đang tạo PDF kết quả đánh giá...');
    return App.gas('generateEvaluationResultPdf', {
      instanceId: instance.id
    }).then(function (response) {
      if (response && response.data) {
        state.data = response.data;
        if (state.selectedInstanceId) state.detailLoadedIds[String(state.selectedInstanceId)] = true;
        renderAll();
      }
      hideLoading();
      var file = response && response.file || {};
      var url = text(file.url || file.fileUrl);
      alertMessage(url ? 'Đã tạo PDF và lưu link vào hồ sơ kết quả.' : 'Đã tạo PDF kết quả đánh giá.', 'Đã tạo PDF');
      if (url) {
        try { window.open(url, '_blank', 'noopener'); } catch (_) {}
      }
      return response;
    }).catch(function (error) {
      hideLoading();
      var message = error && error.message ? error.message : String(error || 'Không tạo được PDF kết quả.');
      setStatus(message, 'error');
      alertMessage(message, 'Không tạo được PDF');
      throw error;
    }).finally(hideLoading);
  }
  function bindEvents() {
    root.addEventListener('click', function (event) {
      var button = event.target.closest('[data-action]');
      if (!button || !root.contains(button)) return;
      var action = button.getAttribute('data-action');
      var id = button.getAttribute('data-id');
      if (action === 'toggle-selector') {
        state.selectorOpen = !state.selectorOpen;
        renderAll();
        return;
      }
      if (action === 'close-selector') {
        state.selectorOpen = false;
        renderAll();
        return;
      }
      if (action === 'refresh') {
        callRead({ forceRefresh: true });
        return;
      }
      if (action === 'select-first-instance') {
        var first = filteredInstances()[0];
        if (first) openInstance(first.id);
        return;
      }
      if (action === 'select-instance') {
        openInstance(id);
        return;
      }
      if (action === 'toggle-score-comment') {
        toggleScoreComment(button);
        return;
      }
      if (action === 'toggle-employee-reflection') {
        toggleEmployeeReflection(button);
        return;
      }
      if (action === 'generate-result-pdf') {
        generateResultPdf();
        return;
      }
      if (action === 'save-draft') submitReview('draft');
    });
    root.addEventListener('input', function (event) {
      var scoreInput = event.target.closest('[data-score-value]');
      if (scoreInput && root.contains(scoreInput)) {
        updateScoreRangeRow(scoreInput.closest('.evaluation-score-row'), true);
        return;
      }
      var scoreComment = event.target.closest('[data-score-comment]');
      if (scoreComment && root.contains(scoreComment)) {
        var row = scoreComment.closest('.evaluation-score-row');
        var button = row && row.querySelector('[data-action="toggle-score-comment"]');
        if (button) button.classList.toggle('is-filled', !!trim(scoreComment.value));
        return;
      }
      var decisionInput = event.target.closest('[data-decision-value],[data-decision-multi-option],[data-decision-duration-amount],[data-decision-duration-unit],[data-decision-duration-permanent]');
      if (decisionInput && root.contains(decisionInput)) {
        syncDecisionAnswerCount();
      }
    });
    root.addEventListener('change', function (event) {
      var decisionInput = event.target.closest('[data-decision-value],[data-decision-multi-option],[data-decision-duration-amount],[data-decision-duration-unit],[data-decision-duration-permanent]');
      if (decisionInput && root.contains(decisionInput)) syncDecisionAnswerCount();
    });
    $('evaluationTypeFilter').addEventListener('change', function () {
      state.selectedType = this.value || 'all';
      state.selectedInstanceId = '';
      state.selectorOpen = true;
      renderAll();
    });
    $('evaluationReviewForm').addEventListener('submit', function (event) {
      event.preventDefault();
      var submitRole = roleForInstance(selectedInstance());
      var submitApprovalRole = normalizeRole(submitRole);
      var isBodSubmission = submitApprovalRole === 'bod' || submitApprovalRole === 'indirect_manager';
      var confirmPromise = typeof window.hcConfirm === 'function'
        ? window.hcConfirm(isBodSubmission
          ? (submitApprovalRole === 'indirect_manager' ? 'Sau khi gửi, quyết định của Quản lý gián tiếp sẽ được khóa và phiếu chuyển sang CEO.' : 'Sau khi gửi, quyết định của Ban giám đốc sẽ được khóa và phiếu chuyển sang bước CnB.')
          : 'Sau khi gửi, phần đánh giá này sẽ chuyển sang bước tiếp theo và bạn không thể sửa nữa.', {
          title: isBodSubmission ? 'Gửi phê duyệt?' : 'Gửi đánh giá?',
          okLabel: isBodSubmission ? 'Gửi phê duyệt' : 'Gửi đánh giá',
          cancelLabel: 'Xem lại'
        })
        : Promise.resolve(true);
      confirmPromise.then(function (confirmed) {
        if (confirmed) submitReview('submit');
      });
    });
  }
  function onOpen(options) {
    options = options || {};
    var requestedInstanceId = String(options.instanceId || options.evaluationInstanceId || options.id || '').trim();
    hideLoading();
    setStatus('', 'default');
    state.selectedInstanceId = requestedInstanceId;
    state.selectedAssignmentId = String(options.assignmentId || options.reviewAssignmentId || '').trim();
    state.commentInstanceId = '';
    state.loadingInstanceId = '';
    state.selectorOpen = false;
    state.detailLoadedIds = {};
    $('evaluationReviewComment').value = '';
    callRead({ forceRefresh: options.forceRefresh === true || options.refresh === true });
  }

  bindEvents();
  renderAll();

  window.openEvaluationModal = function (options) {
    return App.modals.open(MODAL_KEY, options || { trigger: document.activeElement || null });
  };
  window.closeEvaluationModal = function (reason) {
    return App.modals.close(MODAL_KEY, reason || 'programmatic');
  };
  App.modals.register(MODAL_KEY, { root: root, onOpen: onOpen });
})();
