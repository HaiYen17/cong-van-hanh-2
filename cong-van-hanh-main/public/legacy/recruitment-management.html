<!doctype html>
<html lang="vi" data-rpc-endpoint="/api/recruitment/rpc">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#114c41">
    <title>Quản lý Ứng viên · Thuận Việt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
  :root {
    --screen-gap: clamp(18px, 2.5vh, 28px);
    --panel-gap: clamp(24px, 3vw, 48px);
    --hero-radius: 34px;
    --card-radius: 36px;
    --surface-strong: rgba(255, 255, 255, 0.98);
    --line: rgba(34, 64, 57, 0.12);
    --text: #18342f;
    --muted: #62756f;
    --muted-strong: #506661;
    --accent: #ea6c2d;
    --accent-strong: #da5716;
    --accent-deep: #114c41;
    --shadow: 0 30px 70px rgba(17, 45, 39, 0.14);
    --shadow-soft: 0 18px 36px rgba(14, 30, 26, 0.12);
    --background-wash: linear-gradient(135deg, rgba(250, 244, 231, 0.92), rgba(236, 243, 237, 0.96));
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    min-height: 100%;
  }

  body {
    margin: 0;
    font-family: 'Be Vietnam Pro', sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top right, rgba(233, 108, 45, 0.08), transparent 28%),
      radial-gradient(circle at bottom left, rgba(17, 76, 65, 0.1), transparent 24%),
      #f2f1ec;
    overflow-x: hidden;
  }

  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(17, 76, 65, 0.24) transparent;
  }

  *::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }

  *::-webkit-scrollbar-track {
    background: transparent;
  }

  *::-webkit-scrollbar-thumb {
    border: 3px solid transparent;
    border-radius: 999px;
    background: rgba(17, 76, 65, 0.24);
    background-clip: content-box;
  }

  *::-webkit-scrollbar-thumb:hover {
    background: rgba(17, 76, 65, 0.34);
    background-clip: content-box;
  }

  body.dashboard-mode {
    overflow: hidden;
  }

  ::selection {
    background: rgba(234, 108, 45, 0.18);
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  .view-screen.is-hidden,
  .is-hidden {
    display: none !important;
  }

  .screen-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(360px, 47vw) minmax(320px, 1fr);
    gap: var(--panel-gap);
    padding: var(--screen-gap);
    align-items: center;
    position: relative;
    isolation: isolate;
  }

  .hero-panel {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    min-width: 0;
  }

  .hero-visual {
    width: 100%;
    height: calc(100vh - (var(--screen-gap) * 2));
    border-radius: var(--hero-radius);
    background:
      linear-gradient(155deg, rgba(12, 39, 34, 0.08), rgba(12, 39, 34, 0.28)),
      var(--warehouse-background-image) center center / cover no-repeat;
    box-shadow: var(--shadow);
  }

  .login-panel,
  .dashboard-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding-right: clamp(10px, 2vw, 24px);
  }

  .login-panel {
    align-items: flex-start;
    padding-top: clamp(18px, 5vh, 54px);
  }

  .login-card,
  .dashboard-card {
    width: min(100%, 620px);
    background: var(--background-wash);
    border: 1px solid rgba(255, 255, 255, 0.68);
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    padding: clamp(26px, 3vw, 44px);
    position: relative;
    overflow: hidden;
  }

  .login-card,
  .login-card .form-block,
  .login-card .field-group {
    overflow: visible;
  }

  .dashboard-card {
    width: min(100%, 860px);
    height: calc(100vh - (var(--screen-gap) * 2));
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow: hidden;
  }

  .login-card::before,
  .dashboard-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at top right, rgba(234, 108, 45, 0.12), transparent 32%),
      radial-gradient(circle at bottom left, rgba(17, 76, 65, 0.08), transparent 30%);
    pointer-events: none;
  }

  .brand-block,
  .form-block,
  .dashboard-header,
  .feature-groups,
  .dashboard-status {
    position: relative;
    z-index: 1;
  }

  .brand-block {
    display: grid;
    justify-items: center;
    gap: 12px;
    text-align: center;
    margin-bottom: clamp(28px, 4vw, 42px);
  }

  .brand-logo {
    width: clamp(188px, 19vw, 258px);
    max-width: 100%;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 16px 30px rgba(20, 48, 40, 0.12));
  }

  .brand-copy {
    display: grid;
    justify-items: center;
    gap: 16px;
  }

  .brand-kicker {
    margin: 2px 0 0;
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(1rem, 1.35vw, 1.16rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #d07b1f;
    text-align: left;
  }

  .brand-title {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(2.72rem, 4.9vw, 4.42rem);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -0.02em;
    color: var(--accent-deep);
    white-space: nowrap;
  }

  .form-block {
    background: rgba(255, 255, 255, 0.58);
    border: 1px solid rgba(255, 255, 255, 0.76);
    border-radius: 28px;
    padding: clamp(20px, 3vw, 30px);
    backdrop-filter: blur(16px);
  }

  #loginView.screen-shell {
    height: 100vh;
    height: 100dvh;
    min-height: 100vh;
    min-height: 100dvh;
    align-items: stretch;
    overflow: hidden;
  }

  #loginView .hero-panel,
  #loginView .login-panel {
    min-height: 0;
  }

  #loginView .hero-visual {
    height: 100%;
  }

  #loginView .login-panel {
    align-items: center;
    padding-top: 0;
  }

  #loginView .login-card {
    max-height: calc(100vh - (var(--screen-gap) * 2));
    max-height: calc(100dvh - (var(--screen-gap) * 2));
    padding: clamp(18px, 2vh, 28px) clamp(22px, 2.6vw, 36px);
  }

  #loginView .brand-block {
    gap: clamp(6px, 0.9vh, 10px);
    margin-bottom: clamp(12px, 2vh, 22px);
  }

  #loginView .brand-logo {
    width: clamp(144px, 13vw, 190px);
  }

  #loginView .brand-copy {
    gap: clamp(8px, 1.3vh, 12px);
  }

  #loginView .brand-title {
    font-size: clamp(2.12rem, 4.2vw, 3.55rem);
    line-height: 0.9;
  }

  #loginView .notifier-promo-card {
    width: min(100%, 360px);
    grid-template-columns: minmax(0, 1fr) auto;
    padding: 10px 12px;
    border-radius: 18px;
  }

  #loginView .notifier-promo-brand {
    gap: 8px;
  }

  #loginView .notifier-promo-icon-shell {
    width: 38px;
    height: 38px;
    border-radius: 0;
  }

  #loginView .notifier-promo-action {
    border-radius: 12px;
  }

  #loginView .form-block {
    padding: clamp(14px, 2vh, 20px) clamp(18px, 2.2vw, 24px);
    border-radius: 24px;
  }

  #loginView .login-form {
    gap: clamp(10px, 1.35vh, 14px);
  }

  #loginView .field-group {
    gap: 7px;
  }

  #loginView .field-label {
    font-size: 0.86rem;
  }

  #loginView .text-input,
  #loginView .select-input {
    min-height: 48px;
    border-radius: 15px;
  }

  #loginView .primary-button {
    min-height: 50px;
    border-radius: 15px;
  }

  #loginView .combobox-toggle.ui-combobox-toggle {
    right: 8px;
    width: 32px;
    height: 32px;
    border-radius: 12px;
  }

  .notifier-promo-card {
    position: relative;
    width: min(100%, 388px);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "content action";
    column-gap: 14px;
    align-items: center;
    padding: 12px 14px;
    border-radius: 20px;
    border: 1px solid rgba(17, 76, 65, 0.1);
    background: rgba(255, 255, 255, 0.7);
    box-shadow:
      0 16px 32px rgba(17, 45, 39, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.62);
    backdrop-filter: blur(18px);
    color: inherit;
    text-decoration: none;
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease, background 0.22s ease;
  }

  .notifier-promo-card:hover,
  .notifier-promo-card:focus-visible,
  .notifier-promo-card:focus-within {
    transform: translateY(-1px);
    border-color: rgba(17, 76, 65, 0.14);
    box-shadow:
      0 22px 38px rgba(17, 45, 39, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.64);
    background: rgba(255, 255, 255, 0.82);
  }

  .notifier-promo-card:focus-visible {
    outline: none;
  }

  .notifier-promo-card.is-disabled {
    cursor: default;
  }

  .notifier-promo-card.is-disabled:hover {
    transform: none;
    border-color: rgba(17, 76, 65, 0.1);
    box-shadow:
      0 16px 32px rgba(17, 45, 39, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.62);
    background: rgba(255, 255, 255, 0.7);
  }

  .notifier-promo-main {
    grid-area: content;
    min-width: 0;
    display: grid;
    gap: 2px;
    align-content: center;
    text-align: left;
  }

  .notifier-promo-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .notifier-promo-icon-shell {
    width: 44px;
    height: 44px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border-radius: 0;
    background: transparent;
    border: 0;
    box-shadow: none;
    overflow: hidden;
  }

  .notifier-promo-icon-shell--fallback {
    color: var(--accent-deep);
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;
    font-weight: 800;
  }

  .notifier-promo-icon {
    width: 42px;
    height: 42px;
    display: block;
    object-fit: contain;
  }

  .notifier-promo-copy {
    min-width: 0;
    display: grid;
    gap: 2px;
  }

  .notifier-promo-kicker {
    color: #986c3b;
    font-size: 0.58rem;
    font-style: italic;
    font-weight: 700;
    line-height: 1.2;
  }

  .notifier-promo-title {
    color: var(--accent-deep);
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: clamp(0.98rem, 1.42vw, 1.12rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
  }

  .notifier-promo-action {
    grid-area: action;
    display: grid;
    place-items: center;
    min-height: 100%;
    border-left: 1px solid rgba(17, 76, 65, 0.06);
    border-radius: 14px;
    color: #ffffff;
    background: linear-gradient(135deg, rgba(234, 108, 45, 0.9), rgba(218, 87, 22, 0.96));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.22),
      0 10px 22px rgba(218, 87, 22, 0.2);
  }

  .notifier-promo-card.is-disabled .notifier-promo-action {
    background: rgba(17, 76, 65, 0.12);
    color: rgba(17, 76, 65, 0.56);
  }

  .notifier-promo-action svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.25;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .notifier-download-options {
    grid-area: action;
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    min-height: 0;
  }

  .notifier-download-option {
    min-width: 0;
    width: 40px;
    height: 40px;
    min-height: 40px;
    display: grid;
    place-items: center;
    align-content: center;
    padding: 0;
    border-radius: 12px;
    border: 0;
    background: transparent;
    color: var(--accent-deep);
    box-shadow: none;
    text-decoration: none;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  }

  .notifier-download-option:hover,
  .notifier-download-option:focus-visible {
    transform: translateY(-1px);
    background: rgba(234, 108, 45, 0.12);
    box-shadow: none;
    outline: none;
  }

  .notifier-download-option.is-disabled {
    cursor: default;
    pointer-events: none;
    background: transparent;
    color: rgba(38, 70, 64, 0.55);
    box-shadow: none;
  }

  .notifier-download-option svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .notifier-download-option svg rect {
    fill: none;
  }

  .notifier-download-os {
    display: none;
  }

  .notifier-download-soon {
    display: none;
  }

  .notifier-promo-sub {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: calc(100% + 10px);
    opacity: 0;
    padding: 10px 12px;
    border-radius: 14px;
    border: 1px solid rgba(17, 76, 65, 0.08);
    background: rgba(255, 255, 255, 0.86);
    box-shadow: 0 18px 34px rgba(17, 45, 39, 0.1);
    color: rgba(38, 70, 64, 0.78);
    font-size: 0.76rem;
    line-height: 1.45;
    text-align: left;
    pointer-events: none;
    transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 4;
  }

  .notifier-promo-card:hover .notifier-promo-sub,
  .notifier-promo-card:focus-visible .notifier-promo-sub,
  .notifier-promo-card:focus-within .notifier-promo-sub {
    opacity: 1;
    transform: translateY(0);
  }

  .notifier-pair-launch-button {
    padding: 0;
    overflow: hidden;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.84), rgba(245, 247, 245, 0.7));
  }

  .notifier-pair-launch-button:hover {
    background: rgba(255, 255, 255, 0.9);
  }

  .notifier-pair-launch-icon {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  .notifier-pair-launch-fallback {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.92rem;
    font-weight: 800;
    color: var(--accent-deep);
  }

  .notifier-pair-dialog {
    width: min(92vw, 640px);
  }

  .notifier-pair-shell {
    display: grid;
    gap: 18px;
  }

  .notifier-pair-brand-card,
  .notifier-pair-code-card {
    display: grid;
    gap: 14px;
    padding: 18px;
    border-radius: 24px;
    border: 1px solid rgba(17, 76, 65, 0.1);
    background: rgba(255, 255, 255, 0.72);
    box-shadow: 0 18px 34px rgba(17, 45, 39, 0.08);
    backdrop-filter: blur(16px);
  }

  .notifier-pair-brand-card {
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 16px;
  }

  .notifier-pair-brand-mark {
    width: 78px;
    height: 78px;
    display: grid;
    place-items: center;
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(246, 248, 246, 0.86));
    border: 1px solid rgba(17, 76, 65, 0.08);
    box-shadow: 0 14px 28px rgba(17, 45, 39, 0.1);
    overflow: hidden;
  }

  .notifier-pair-brand-mark--fallback {
    color: var(--accent-deep);
    font-family: 'Montserrat', sans-serif;
    font-size: 1.2rem;
    font-weight: 800;
  }

  .notifier-pair-brand-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  .notifier-pair-brand-copy {
    min-width: 0;
    display: grid;
    gap: 6px;
  }

  .notifier-pair-brand-kicker {
    margin: 0;
    font-size: 0.72rem;
    font-style: italic;
    font-weight: 600;
    line-height: 1.2;
    color: #986c3b;
  }

  .notifier-pair-brand-title {
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: clamp(1.34rem, 2.2vw, 1.9rem);
    font-weight: 700;
    line-height: 1.08;
    color: var(--accent-deep);
    letter-spacing: -0.04em;
  }

  .notifier-pair-download-options {
    display: grid;
    grid-template-columns: repeat(2, 58px);
    gap: 8px;
    justify-self: end;
  }

  .notifier-pair-download-button {
      width: 58px;
      min-width: 58px;
      height: 58px;
      min-height: 58px;
      padding: 6px 4px;
      display: inline-grid;
      align-items: center;
      justify-content: center;
      justify-items: center;
      align-content: center;
      justify-self: end;
      gap: 2px;
      border-radius: 20px;
      background: rgba(17, 76, 65, 0.08);
      border-color: rgba(17, 76, 65, 0.1);
      color: var(--accent-deep);
      box-shadow: 0 14px 26px rgba(17, 45, 39, 0.08);
    }

    .notifier-pair-download-button:hover,
    .notifier-pair-download-button:focus-visible {
      background: rgba(17, 76, 65, 0.12);
      border-color: rgba(17, 76, 65, 0.2);
      transform: translateY(-1px);
    }

    .notifier-pair-download-button.is-disabled {
      cursor: default;
      pointer-events: none;
      background: rgba(17, 76, 65, 0.05);
      border-color: rgba(17, 76, 65, 0.08);
      color: rgba(38, 70, 64, 0.56);
      box-shadow: none;
    }

    .notifier-pair-download-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .notifier-pair-download-button svg rect {
      fill: none;
    }

    .notifier-pair-download-os,
    .notifier-pair-download-soon {
      color: currentColor;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-weight: 800;
      line-height: 1;
      text-align: center;
    }

    .notifier-pair-download-os {
      font-size: 0.58rem;
    }

    .notifier-pair-download-soon {
      font-size: 0.43rem;
      line-height: 1.08;
    }

  .notifier-pair-code-head,
  .notifier-pair-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .notifier-pair-code-label {
    margin: 0;
  }

  .notifier-pair-refresh-button svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.1;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .notifier-pair-code-value {
    min-height: 84px;
    display: grid;
    place-items: center;
    padding: 0 18px;
    border-radius: 22px;
    background: linear-gradient(145deg, rgba(16, 64, 53, 0.06), rgba(234, 108, 45, 0.08));
    color: var(--accent-deep);
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: clamp(1.9rem, 4vw, 2.8rem);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: center;
  }

  .notifier-pair-expire {
    color: var(--muted-strong);
    font-size: 0.84rem;
    font-weight: 500;
    line-height: 1.45;
  }

  .notifier-pair-copy-button,
  .notifier-pair-open-button {
    min-width: 180px;
  }

  .notifier-pair-status {
    text-align: left;
  }

  .notifier-pair-status.is-error {
    color: #a03d29;
  }

  .notifier-pair-status.is-success {
    color: var(--accent-deep);
  }

  .notifier-pair-status.is-info {
    color: var(--muted-strong);
  }

  .form-header {
    margin-bottom: 22px;
  }

  .section-tag {
    margin: 0 0 10px;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.16em;
  }

  .login-form {
    display: grid;
    gap: 18px;
  }

  .field-group {
    display: grid;
    gap: 10px;
  }

  .field-group.is-hidden {
    display: none;
  }

  .field-label {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--accent-deep);
  }

  .form-message,
  .dashboard-status {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--muted);
  }

  .form-message:empty,
  .dashboard-status:empty {
    display: none;
  }

  .form-message.is-error,
  .dashboard-status.is-error {
    color: #b33a18;
  }

  .form-message.is-success,
  .dashboard-status.is-success {
    color: #0f6a56;
  }

  .dashboard-status.is-info {
    color: var(--muted-strong);
  }

  .select-shell {
    position: relative;
  }

  .toggle-switch input {

    inset: 0;

  .toggle-slider {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: rgba(216, 229, 224, 0.96);
    transition: background 0.22s ease, box-shadow 0.22s ease;
    box-shadow: inset 0 1px 2px rgba(17, 76, 65, 0.08);
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    top: 5px;
    left: 5px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 8px 18px rgba(17, 45, 39, 0.18);
    transition: transform 0.22s ease;
  }

  .toggle-switch input:checked + .toggle-slider {
    background: rgba(17, 76, 65, 0.2);
  }

  .toggle-switch input:checked + .toggle-slider::before {
    transform: translateX(36px);
  }

<script>
  (function () {
    var KEY = 'candidateManagement';
    var root = document.getElementById('candidateManagementModal');
    if (!root || !window.App || !App.modals) return;

    var state = {
      data: null,
      view: 'today',
      query: '',
      position: '',
      stage: '',
      selected: null,
      detail: null,
      campaignFormOpen: false,
      loadedViews: {},
      viewSnapshots: {},
      loadedAt: 0,
      scoringConfig: null,
      sourceHeaderOptions: [],
      sourceDefinitionDraft: null,
      duplicateDetail: null,
      codeRepair: null,
      criteriaDraft: [],
      loadingPromise: null,
      viewPromises: {},
      prefetchStarted: false,
      offerCenter: null,
      offerLoading: false,
      offerPromise: null,
      campaignTab: 'create',
      reportTab: 'overview',
      intakeTab: 'template',
      toolsTab: 'source',
      temporaryJd: null,
      temporaryJdLoading: false,
      temporaryJdDraft: null,
      report: null,
      reportLoading: false,
      reportFilters: {periodType:'all',dateBasis:'received',year:new Date().getFullYear(),month:new Date().getMonth()+1,quarter:Math.floor(new Date().getMonth()/3)+1,dateFrom:'',dateTo:'',company:'',department:'',position:'',source:'',campaign:'',recruiter:'',requisitionCode:'',ageBand:'',ageFrom:'',ageTo:'',primaryDimension:'source',secondaryDimension:'none'},
      selectedInterviewId: ''
    };

    var navItems = [
      { key: 'today', label: 'Việc hôm nay', icon: '✓' },
      { key: 'pipeline', label: 'Hành trình ứng viên', icon: '→' },
      { key: 'campaigns', label: 'Nhu cầu tuyển', icon: '◎' },
      { key: 'schedule', label: 'Lịch & phân công', icon: '◷' },
      { key: 'offers', label: 'Offer & nhận việc', icon: '◇' },
      { key: 'intake', label: 'Tiếp nhận hồ sơ', icon: '+' },
      { key: 'quality', label: 'Kiểm tra dữ liệu', icon: '!' },
      { key: 'tools', label: 'Công cụ vận hành', icon: '⌘' },
      { key: 'scoring', label: 'Tiêu chí chấm', icon: '★' },
      { key: 'temporary-jd', label: 'JD phỏng vấn nhanh', icon: 'J' },
      { key: 'reports', label: 'Báo cáo tuyển dụng', icon: '▥' },
    ];

    function $(id) { return document.getElementById(id); }
    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function normalize(value) {
      return String(value == null ? '' : value).toLowerCase().normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/\s+/g, ' ').trim();
    }
    function formatDate(value, withTime) {
      if (!value) return 'Chưa đặt';
      var date = new Date(value);
      if (isNaN(date.getTime())) return esc(value);
      return date.toLocaleDateString('vi-VN') + (withTime ? ' · ' + date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '');
    }
    function empty(message) { return '<div class="rhm-empty">' + esc(message) + '</div>'; }
    function pill(label, tone) { return '<span class="rhm-pill' + (tone ? ' ' + tone : '') + '">' + esc(label || 'Chưa xác định') + '</span>'; }
    function button(label, action, primary, attrs) {
      return '<button class="ui-button ' + (primary ? 'ui-button--primary' : 'ui-button--secondary') + '" data-action="' + esc(action) + '" ' + (attrs || '') + ' type="button">' + esc(label) + '</button>';
    }

    function navCount(key) {
      var data = state.data || {};
      var dashboard = data.dashboard || {};
      if (key === 'today') return dashboard.needAttention || 0;
      if (key === 'pipeline') return dashboard.activeCandidates || 0;
      if (key === 'campaigns') return dashboard.activeCampaigns || 0;
      if (key === 'schedule') return dashboard.upcomingInterviews || 0;
      if (key === 'offers') return dashboard.offers || 0;
      if (key === 'intake') return (data.intake || {}).total || 0;
      if (key === 'quality') return ((data.dataQuality || {}).duplicatePhoneGroups || []).length;
      return '';
    }

    function renderNav() {
      $('rhmNav').innerHTML = navItems.map(function (item) {
        var count = navCount(item.key);
        return '<button class="rhm-nav-button' + (state.view === item.key ? ' is-active' : '') + '" data-rhm-view="' + item.key + '" type="button">' +
          '<span class="rhm-nav-icon">' + item.icon + '</span><span>' + esc(item.label) + '</span>' +
          (count === '' ? '' : '<span class="rhm-nav-count">' + esc(count) + '</span>') + '</button>';
      }).join('');
    }

    function pageHead(title, subtitle, actions) {
      return '<div class="rhm-page-head"><div><h3>' + esc(title) + '</h3><p>' + esc(subtitle) + '</p></div><div class="rhm-actions">' + (actions || '') + '</div></div>';
    }

    function subnav(group, items, active) {
      return '<div class="rhm-subnav" role="tablist">' + items.map(function(item){
        return '<button class="rhm-subnav-button' + (item.key === active ? ' is-active' : '') + '" data-subtab-group="' + esc(group) + '" data-subtab="' + esc(item.key) + '" type="button">' + esc(item.label) + '</button>';
      }).join('') + '</div>';
    }

    function candidateTask(candidate) {
      return '<button class="rhm-task" data-open-candidate="' + esc(candidate.applicationId) + '" type="button">' +
        '<span class="rhm-task-dot' + (candidate.isOverdue ? ' is-overdue' : '') + '"></span>' +
        '<span class="rhm-task-main"><strong>' + esc(candidate.name || candidate.candidateCode) + '</strong>' +
        '<span>' + esc(candidate.position || 'Chưa gắn vị trí') + ' · ' + esc(candidate.nextAction || candidate.stageLabel) + '</span></span>' +
        pill(candidate.isOverdue ? 'Quá hạn' : candidate.progressLabel, candidate.isOverdue ? 'is-danger' : '') + '</button>';
    }

    function renderToday() {
      var data = state.data || {};
      var dashboard = data.dashboard || {};
      var queues = data.taskQueues || {};
      var summary = [
        ['Ứng viên đang tuyển', dashboard.activeCandidates, 'pipeline', 'Toàn bộ hồ sơ còn xử lý'],
        ['Cần ưu tiên', dashboard.needAttention, 'today', 'Hồ sơ mới, sơ vấn hoặc quá hạn'],
        ['Lịch sắp tới', dashboard.upcomingInterviews, 'schedule', 'Các buổi phỏng vấn đã xếp'],
        ['Thiếu phiếu chấm', dashboard.missingScorecards, 'schedule', 'Cần nhắc người phỏng vấn'],
        ['Đang Offer', dashboard.offers, 'offers', 'Chờ gửi hoặc chờ phản hồi']
      ];
      var html = pageHead('Việc HR cần làm hôm nay', 'Mở lên là thấy người cần xử lý tiếp theo, không phải lọc lại từ đầu.', button('Làm mới', 'reload', false));
      html += '<div class="rhm-summary-grid">' + summary.map(function (item) {
        return '<button class="rhm-summary-card" data-rhm-view="' + item[2] + '" type="button"><span>' + esc(item[0]) + '</span><strong>' + esc(item[1] || 0) + '</strong><small>' + esc(item[3]) + '</small></button>';
      }).join('') + '</div>';
      html += '<div class="rhm-two-columns">';
      html += '<section class="rhm-section ui-module-panel"><div class="rhm-section-head"><div><h4>Ưu tiên xử lý</h4><p>Hồ sơ mới, cần gọi hoặc đã quá hạn.</p></div>' + pill((queues.priority || []).length + ' hồ sơ', 'is-warning') + '</div><div class="rhm-list">' +
        ((queues.priority || []).length ? queues.priority.map(candidateTask).join('') : empty('Không có hồ sơ cần xử lý gấp.')) + '</div></section>';
      html += '<section class="rhm-section ui-module-panel"><div class="rhm-section-head"><div><h4>Lịch phỏng vấn gần nhất</h4><p>Nhìn nhanh lịch và tình trạng phiếu chấm.</p></div></div><div class="rhm-list">' +
        ((queues.interviews || []).length ? queues.interviews.slice(0, 8).map(interviewRow).join('') : empty('Chưa có lịch phỏng vấn sắp tới.')) + '</div></section>';
      html += '</div>';
      if ((queues.missingScores || []).length) {
        html += '<section class="rhm-section ui-module-panel"><div class="rhm-section-head"><div><h4>Đang chờ người phỏng vấn hoàn tất</h4><p>HR có thể nhìn ngay ai còn thiếu phiếu.</p></div></div><div class="rhm-list">' + queues.missingScores.map(function (item) {
          return '<div class="rhm-interview-row"><div><strong>' + esc(item.candidateName) + '</strong><span>' + esc(item.roundLabel + ' · ' + formatDate(item.startAt, true)) + '</span></div><div>' + item.missing.map(function (name) { return pill(name, 'is-warning'); }).join(' ') + '</div></div>';
        }).join('') + '</div></section>';
      }
      $('rhmMain').innerHTML = '<div class="rhm-view">' + html + '</div>';
    }

    function scheduleDateParts(value) {
      var date = value ? new Date(value) : null;
      if (!date || Number.isNaN(date.getTime())) return { date:null, day:'—', month:'Chưa đặt', time:'Cần xếp giờ' };
      return {
        date:date,
        day:String(date.getDate()).padStart(2,'0'),
        month:'Thg ' + (date.getMonth() + 1),

    function bindCampaignCascade() {
      var fields = [
        {id:'rhmCampaignCompany',key:'company',fallback:'companies'},
        {id:'rhmCampaignLocation',key:'location',fallback:'locations'},
        {id:'rhmCampaignBlock',key:'block',fallback:'blocks'},
        {id:'rhmCampaignDepartment',key:'department',fallback:'departments'},
        {id:'rhmCampaignDivision',key:'division',fallback:'divisions'},

        {id:'rhmCampaignGroup',key:'groupName',fallback:'groups'}
      ];
      var dropdowns=(state.data||{}).dropdowns||{};
      var paths=(state.data||{}).organizationPaths||[];
      function uniqueValues(values){return values.filter(Boolean).filter(function(value,index,list){return list.indexOf(value)===index;}).sort(function(a,b){return String(a).localeCompare(String(b),'vi');});}
      function comparable(value){return String(value||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLocaleLowerCase('vi');}
      function refill(fromIndex) {
        fields.forEach(function(field,index){
          if(index<fromIndex)return;
          var select=$(field.id);if(!select)return;
          var previous=select.value;
          var parents=fields.slice(0,index);
          var hasSelectedParent=parents.some(function(parent){var control=$(parent.id);return !!(control&&control.value);});
          var matching=paths.filter(function(path){
            return parents.every(function(parent){var control=$(parent.id);return !control||!control.value||comparable(path[parent.key])===comparable(control.value);});
          });
          var values=uniqueValues(matching.map(function(path){return path[field.key]||'';}));
          if(!values.length&&(!paths.length||!hasSelectedParent))values=uniqueValues(dropdowns[field.fallback]||[]);
          select.innerHTML=options(values,previous);
          var equivalent=values.filter(function(value){return comparable(value)===comparable(previous);})[0]||'';
          if(previous&&equivalent)select.value=equivalent;else select.value='';
        });
      }
      fields.forEach(function(field,index){var select=$(field.id);if(select)select.addEventListener('change',function(){refill(index+1);});});
      refill(0);
    }

    function renderSchedule() {
      var queues = (state.data || {}).taskQueues || {};
      var interviews = queues.interviews || [];
      var today = new Date();today.setHours(0,0,0,0);
      var tomorrow = new Date(today);tomorrow.setDate(tomorrow.getDate()+1);
      var nextWeek = new Date(today);nextWeek.setDate(nextWeek.getDate()+7);
      var needsSchedule = interviews.filter(function(item){return !scheduleDateParts(item.startAt).date;});
      var upcoming = interviews.filter(function(item){var date=scheduleDateParts(item.startAt).date;return date&&date>=today;}).sort(function(a,b){return new Date(a.startAt)-new Date(b.startAt);});
      var todayCount = upcoming.filter(function(item){var date=scheduleDateParts(item.startAt).date;return date&&date>=today&&date<tomorrow;}).length;
      var nextWeekCount = upcoming.filter(function(item){var date=scheduleDateParts(item.startAt).date;return date&&date<nextWeek;}).length;
      var missingMap = {};
      (queues.missingScores || []).forEach(function(item){
        var key=item.interviewId||item.applicationId||item.candidateName;

    function reportRate(value) {
      var number = Number(value || 0);
      return '<span class="rhm-rate' + (number < 20 ? ' is-low' : '') + '">' + esc(number) + '%</span>';
    }

    function reportTable(headers, rows) {
      if (!rows || !rows.length) return empty('Chưa có dữ liệu phù hợp với bộ lọc này.');
      return '<div class="rhm-report-table-wrap"><table class="rhm-report-table"><thead><tr>' + headers.map(function (item) { return '<th>' + esc(item.label) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.map(function (row) {
        return '<tr>' + headers.map(function (item) {
          var value = typeof item.render === 'function' ? item.render(row) : row[item.key];
          return '<td>' + (item.html ? value : esc(value == null || value === '' ? '—' : value)) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
    }

        {key:'round2',label:'Vòng 2'},

      return '<section class="rhm-section ui-module-panel rhm-report-filter-panel"><div class="rhm-section-head"><div><h4>1. Chọn phạm vi dữ liệu</h4><p>'+esc(scopeNote)+'</p></div></div><div class="rhm-report-filter-grid rhm-report-filter-grid--scope">' +
        '<label class="rhm-field"><span>Phạm vi dữ liệu</span><select id="rhmReportPeriod" class="rhm-select"><option value="all" '+(periodType==='all'?'selected':'')+'>Toàn bộ dữ liệu</option><option value="active" '+(periodType==='active'?'selected':'')+'>Hồ sơ đang mở</option><option value="month" '+(periodType==='month'?'selected':'')+'>Theo tháng</option><option value="quarter" '+(periodType==='quarter'?'selected':'')+'>Theo quý</option><option value="year" '+(periodType==='year'?'selected':'')+'>Theo năm</option><option value="custom" '+(periodType==='custom'?'selected':'')+'>Khoảng ngày tùy chọn</option></select></label>' + periodFields + '</div>' +
        '<div class="rhm-section-head rhm-report-filter-heading"><div><h4>2. Chọn cách phân tích</h4><p>Có thể chỉ xem theo Nguồn, hoặc đặt Nguồn cạnh Nhu cầu để biết kênh nào hợp với từng vị trí.</p></div></div><div class="rhm-report-filter-grid rhm-report-filter-grid--analysis">'+dimensionSelect('rhmReportPrimary','Phân tích chính',filters.primaryDimension||'source',false)+dimensionSelect('rhmReportSecondary','So sánh theo',filters.secondaryDimension||'none',true)+'</div>'+

    function reportOverview(report) {
      var k=report.kpis||{};
      var sources=report.sources||[], requisitions=report.requisitions||[], funnel=report.funnel||[];
      var eligibleSources=sources.filter(function(item){return Number(item.applications||0)>=3;});
      var bestSource=eligibleSources.slice().sort(function(a,b){return Number(b.hireRate||0)-Number(a.hireRate||0)||Number(b.cvPassRate||0)-Number(a.cvPassRate||0);})[0]||sources[0]||{};
      var biggestDrop=funnel.slice(1).sort(function(a,b){return Number(b.dropOff||0)-Number(a.dropOff||0);})[0]||{};
      var demandGap=requisitions.reduce(function(sum,item){return sum+Number(item.remaining||0);},0);
      var aging=report.aging||{};
      var scopeText=report.period&&report.period.from?('Từ '+formatDate(report.period.from,false)+' đến '+formatDate(report.period.to,false)+' · '+(report.period.label||'')):(report.period&&report.period.label||'Toàn bộ dữ liệu');
      var html='<section class="rhm-report-hero"><div><h4>Bức tranh tuyển dụng theo phạm vi đã chọn</h4><p>'+esc(scopeText)+' · cập nhật '+esc(formatDate(report.generatedAt,true))+'</p></div><div class="rhm-report-kpis">'+[
        ['Hồ sơ nhận',k.total],['Qua lọc CV',(k.cvPassed||0)+' · '+(k.cvPassRate||0)+'%'],['Đến Vòng 1',(k.round1||0)+' · '+(k.interviewRate||0)+'%'],['Đã Offer',k.offered],['Đã nhận việc',(k.hired||0)+' · '+(k.hireRate||0)+'%'],['Ngày đến PV',k.averageDaysToInterview||0]
      ].map(function(item){return '<article class="rhm-report-kpi"><span>'+esc(item[0])+'</span><strong>'+esc(item[1]||0)+'</strong></article>';}).join('')+'</div></section>';
      html+='<div class="rhm-insight-grid"><article class="rhm-insight-card"><span>Kênh nổi bật</span><strong>'+esc(bestSource.name||'Chưa đủ dữ liệu')+'</strong><small>'+(bestSource.name?esc((bestSource.hireRate||0)+'% tuyển thành công · '+(bestSource.cvPassRate||0)+'% qua lọc'):'Cần ít nhất một nguồn có hồ sơ trong kỳ')+'</small></article>' +
        '<article class="rhm-insight-card is-alert"><span>Điểm rơi lớn nhất</span><strong>'+esc(biggestDrop.label||'Chưa đủ dữ liệu')+'</strong><small>'+esc((biggestDrop.dropOff||0)+' hồ sơ rơi · còn '+(biggestDrop.conversionFromPrevious||0)+'% so với bước trước')+'</small></article>' +
        '<article class="rhm-insight-card'+(Number(aging.over30||0)?' is-alert':'')+'"><span>Hồ sơ tồn trên 30 ngày</span><strong>'+esc(aging.over30||0)+'</strong><small>Ưu tiên rà soát để tránh bỏ quên ứng viên.</small></article>' +
        '<article class="rhm-insight-card"><span>Khoảng trống nhu cầu</span><strong>'+esc(demandGap)+'</strong><small>Số lượng còn thiếu trên các nhu cầu đã khai báo chỉ tiêu.</small></article></div>';
      html+='<section class="rhm-section ui-module-panel"><div class="rhm-section-head"><div><h4>Phễu chuyển đổi toàn phạm vi</h4><p>Mỗi bước thể hiện tỷ lệ giữ lại so với bước ngay trước và số hồ sơ bị rơi.</p></div></div><div class="rhm-funnel">'+funnel.map(function(item){return '<article class="rhm-funnel-step"><strong>'+esc(item.value)+'</strong><span>'+esc(item.label)+'</span><small>'+esc((item.conversionFromPrevious||0)+'% · rơi '+(item.dropOff||0))+'</small></article>';}).join('')+'</div></section>';
      html+='<div class="rhm-two-columns"><section class="rhm-section ui-module-panel"><div class="rhm-section-head"><div><h4>Xu hướng hồ sơ</h4><p>Lượng nhận, qua lọc và nhận việc theo ngày/tháng.</p></div></div>'+chartRows((report.trend||[]),'date','applications')+'</section><section class="rhm-section ui-module-panel"><div class="rhm-section-head"><div><h4>Trạng thái hiện tại</h4><p>Cho biết khối lượng đang nằm ở đâu trong vận hành.</p></div></div>'+chartRows((report.statuses||[]).slice(0,12),'name','value')+'</section></div>';
      return html;
    }

      else if (state.view === 'reports') renderReports();
      else if (state.view === 'settings') renderSettings();
      else { state.view = 'today'; renderToday(); }
    }

    function mergeWorkspace(response, view) {
      state.data = state.data || {};
      ['viewer','stages','progressOptions','outcomeOptions','formSync','trackingSync'].forEach(function (key) { if (response[key] != null) state.data[key] = response[key]; });
      if (view === 'today') ['dashboard','pipeline','taskQueues','candidates','campaigns','positions'].forEach(function (key) { state.data[key] = response[key]; });
      else if (view === 'pipeline') ['pipeline','candidates','positions'].forEach(function (key) { state.data[key] = response[key]; });
      else if (view === 'campaigns') ['campaigns','dropdowns','sources','organizationPaths'].forEach(function (key) { state.data[key] = response[key]; });
      else if (view === 'schedule') ['taskQueues','candidates','reviewerOptions'].forEach(function (key) { state.data[key] = response[key]; });
      else if (view === 'offers') ['candidates'].forEach(function (key) { state.data[key] = response[key]; });
      else if (view === 'intake') ['intake','dropdowns','sources'].forEach(function (key) { state.data[key] = response[key]; });
      else if (view === 'quality') ['dataQuality','candidates'].forEach(function (key) { state.data[key] = response[key]; });
      else if (view === 'tools') ['dropdowns','sources'].forEach(function (key) { state.data[key] = response[key]; });
      else if (view === 'temporary-jd') ['dropdowns','candidates'].forEach(function (key) { state.data[key] = response[key]; });
      else if (view === 'settings') ['dropdowns','sources','reviewerOptions'].forEach(function (key) { state.data[key] = response[key]; });
      if (view === 'campaigns' && response.dashboard) {
        state.data.dashboard = Object.assign({}, state.data.dashboard || {}, { activeCampaigns:response.dashboard.activeCampaigns });
      }
      state.loadedViews[view] = true;
    }

    function acceptWorkspace(response) {
      state.data = response;
      state.loadedAt = Date.now();
      state.loadedViews = {};
      state.viewSnapshots = { today:response, pipeline:response };
      state.prefetchStarted = false;
      (response.loadedViews || []).forEach(function (view) { state.loadedViews[view] = true; });
      return response;
    }

    function preloadWorkspace() {
      if (state.data && Date.now() - state.loadedAt < 120000) return Promise.resolve(state.data);
      if (state.loadingPromise) return state.loadingPromise;
      var warmed = window.__candidateManagementWarmupData;
      if (warmed && warmed.response && Date.now() - Number(warmed.savedAt || 0) < 120000) {
        return Promise.resolve(acceptWorkspace(warmed.response));
      }
      if (window.__candidateManagementWarmupPromise) {
        state.loadingPromise = window.__candidateManagementWarmupPromise.then(function(response) {
          if (!response) throw new Error('Không tải được dữ liệu Quản lý Ứng viên.');
          return acceptWorkspace(response);
        }).finally(function () { state.loadingPromise = null; });
        return state.loadingPromise;
      }
      state.loadingPromise = App.gas('getRecruitmentHrWorkspaceBundle', { limit:120 }).then(acceptWorkspace)
        .finally(function () { state.loadingPromise = null; });
      return state.loadingPromise;
    }

    function loadView(view, force, options) {
      options = options || {};
      if (!force && state.data && state.loadedViews[view]) return Promise.resolve(state.data);
      var existing = state.viewPromises[view];
      if (existing) {
        if (!options.silent) App.ui.showModuleLoading('Đang tải ' + ((navItems.filter(function (item) { return item.key === view; })[0] || {}).label || 'dữ liệu tuyển dụng'));
        return existing.finally(function () { if (!options.silent) App.ui.hideLoading(); });
      }
      if (!options.silent) App.ui.showModuleLoading('Đang tải ' + ((navItems.filter(function (item) { return item.key === view; })[0] || {}).label || 'dữ liệu tuyển dụng'));
      var request = App.gas('getRecruitmentHrWorkspace', {
        view: view,
        query: view === 'pipeline' ? state.query : '',
        position: view === 'pipeline' ? state.position : '',
        stage: view === 'pipeline' ? state.stage : '',
        limit: view === 'pipeline' ? 240 : 160
      }).then(function (response) {
        state.viewSnapshots[view] = response;
        state.loadedViews[view] = true;
        if (state.view === view) { mergeWorkspace(response, view); render(); }
        if (view === 'offers' && !state.offerCenter && !state.offerLoading) loadOfferCenter('', true);
        return response;
      }).catch(function (error) {
        if (!options.silent) App.ui.alert(error.message || String(error), { title:'Không tải được màn tuyển dụng' });
        return null;
      }).finally(function () {
        delete state.viewPromises[view];
        if (!options.silent) App.ui.hideLoading();
      });
      state.viewPromises[view] = request;
      return request;
    }

    function prefetchWorkspaceViews() {
      if (state.prefetchStarted) return;
      state.prefetchStarted = true;
      var queue = ['campaigns', 'intake', 'tools', 'schedule', 'offers', 'quality'];
      function next() {
        var view = queue.shift();
        if (!view) return;
        if (state.loadedViews[view]) { setTimeout(next, 80); return; }
        loadView(view, false, { silent:true }).catch(function () {}).finally(function () { setTimeout(next, 120); });
      }
      setTimeout(next, 250);
    }

    function loadOfferCenter(sheetName, silent) {
      if (state.offerPromise) return state.offerPromise;
      state.offerLoading = true;
      if (!silent && state.view === 'offers') renderOffers();

        state.offerCenter = response;
        if (state.view === 'offers') renderOffers();
        return response;
      }).catch(function (error) {
        if (!silent) return App.ui.alert(error.message || String(error), { title:'Không tải được nguồn Offer' });
      }).finally(function () {
        state.offerLoading = false;
        state.offerPromise = null;
        if (state.view === 'offers') renderOffers();
      });
      return state.offerPromise;
    }

    function load(options) {
      options = options || {};
      if (!options.silent) App.ui.showModuleLoading('Quản lý Ứng viên');
      return preloadWorkspace().then(function (response) {
        render();
        prefetchWorkspaceViews();
      }).catch(function (error) {
        App.ui.alert(error.message || String(error), { title: 'Không mở được bàn tuyển dụng' });
      }).finally(function () {

      if (local) return local[3] + '-' + String(local[2]).padStart(2,'0') + '-' + String(local[1]).padStart(2,'0');

    function parseCsv(text) {
      var rows = [], row = [], cell = '', quoted = false;
      text = String(text || '').replace(/^\uFEFF/, '');
      var delimiter = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
      for (var index=0; index<text.length; index+=1) {
        var char=text[index], next=text[index+1];
        if (char === '"' && quoted && next === '"') { cell += '"'; index += 1; }
        else if (char === '"') quoted = !quoted;
        else if (char === delimiter && !quoted) { row.push(cell.trim()); cell=''; }
        else if ((char === '\n' || char === '\r') && !quoted) {
          if (char === '\r' && next === '\n') index += 1;
          row.push(cell.trim()); cell='';
          if (row.some(function (value) { return value; })) rows.push(row);
          row=[];
        } else cell += char;
      }
      row.push(cell.trim());
      if (row.some(function (value) { return value; })) rows.push(row);
      return rows;
    }

    function importCsv() {
      var input = $('rhmCsvFile');

      var reader = new FileReader();
      App.ui.showModuleLoading('đọc file ứng viên');
      reader.onload = function () {
        try {
          var rows = parseCsv(reader.result);
          if (rows.length < 2) throw new Error('File không có dòng dữ liệu.');
          var headers = rows.shift().map(normalize);
          function value(row, aliases) { for (var i=0;i<aliases.length;i+=1){var at=headers.indexOf(normalize(aliases[i]));if(at>=0)return row[at]||'';}return ''; }
          var payloadRows = rows.map(function (row) { return {
            name:value(row,['Họ và tên','Họ tên ứng viên','Tên ứng viên']), phone:value(row,['Số điện thoại','SĐT','Phone']),
            email:value(row,['Email']), position:value(row,['Vị trí','Vị trí ứng tuyển','Chức vụ']), source:value(row,['Nguồn','Nguồn tuyển dụng']),
            requisitionCode:value(row,['Mã tuyển dụng','Mã yêu cầu tuyển dụng']), cvUrl:value(row,['Link CV','LinkCV','CV'])
          }; }).filter(function (item) { return item.name || item.phone || item.email; });
          if (!payloadRows.length) throw new Error('Không nhận ra các cột Họ tên, Số điện thoại hoặc Email.');
          App.ui.hideLoading();
          write('importCandidateManagementManual',{ rows:payloadRows },'Đã nạp file ứng viên');
        } catch (error) {
          App.ui.hideLoading();
          App.ui.alert(error.message || String(error),{ title:'Không đọc được file CSV' });
        }
      };
      reader.onerror = function () { App.ui.hideLoading(); App.ui.alert('Không đọc được file đã chọn.',{ title:'Lỗi file' }); };
      reader.readAsText(file,'UTF-8');

      App.ui.confirm('Hệ thống sẽ dồn số của hồ sơ còn ở bước CV/liên hệ vào các số trống. Mã của người đã phỏng vấn hoặc đã có phiếu đánh giá được giữ nguyên. Ông muốn chạy ngay?',{title:'Đồng bộ STT theo quy tắc V2'}).then(function(confirmed){if(confirmed)write('syncRecruitmentAvailableOrders',{},'Đã đồng bộ STT theo quy tắc V2');});
    }

    function syncFormResults() {
      App.ui.confirm('Hệ thống sẽ kiểm tra cả bài test và kết quả sơ khảo trong workbook tuyển dụng, sau đó cập nhật vào PostgreSQL theo mã ứng viên. Dữ liệu đã có sẽ không bị nhân đôi. Ông muốn chạy ngay?', { title:'Đồng bộ kết quả tuyển dụng' }).then(function (confirmed) {
        if (confirmed) write('syncRecruitmentFormResults', {}, 'Đã đồng bộ kết quả tuyển dụng');
      });
    }

    function syncV2Input() {
      App.ui.confirm('Hệ thống sẽ đọc toàn bộ đầu vào ứng viên từ sheet Theo dõi Tuyển dụng V2 và ánh xạ vào PostgreSQL. Dòng đã đồng bộ không đổi sẽ được bỏ qua, không tạo hồ sơ trùng. Ông muốn chạy ngay?', { title:'Ánh xạ đầu vào ứng viên V2' }).then(function (confirmed) {
        if (confirmed) write('syncRecruitmentTrackingInput', {}, 'Đã ánh xạ đầu vào ứng viên V2');
      });
    }

    function loadScoring() {
      App.ui.showModuleLoading('cấu hình chấm ứng viên');
      App.gas('getRecruitmentScoringConfig',{}).then(function(response){state.scoringConfig=response;renderScoring();})
        .catch(function(error){App.ui.alert(error.message||String(error),{title:'Không tải được tiêu chí chấm'});})
        .finally(function(){App.ui.hideLoading();});
    }

    function saveCriterion() {
      var name=String($('rhmCriterionName').value||'').trim();
      if(!name){App.ui.alert('Nhập tên tiêu chí.',{title:'Thiếu thông tin'});return;}
      var code='REC_CRI_' + Date.now();
      write('saveRecruitmentCriteriaEntity',{entityType:'criteria',record:{code:code,name:name,description:$('rhmCriterionDescription').value,scoreGroupId:$('rhmCriterionGroup').value,sourceType:'recruitment',scoringMethod:'scale_10',isActive:true}},'Đã lưu tiêu chí',loadScoring);
    }

    function saveScoreGroup() {
      var code=String($('rhmScoreGroupCode').value||'').trim().toUpperCase();
      var name=String($('rhmScoreGroupName').value||'').trim();
      if(!code||!name){App.ui.alert('Nhập đủ mã và tên nhóm tiêu chí.',{title:'Thiếu thông tin'});return;}
      write('saveRecruitmentCriteriaEntity',{entityType:'scoreGroup',record:{code:code,name:name,description:'Nhóm tiêu chí dùng trong Tuyển dụng',defaultWeightPercent:Number($('rhmScoreGroupWeight').value||100),sourceType:'recruitment',isActive:true}},'Đã lưu nhóm tiêu chí',loadScoring);
    }

    function saveScopeMapping() {
      var scopeType=$('rhmScopeType').value;
      var scopeValue=scopeType==='global'?'*':String($('rhmScopeValue').value||'').trim();
      if(scopeType!=='global'&&!scopeValue){App.ui.alert('Chọn đối tượng áp dụng.',{title:'Thiếu phạm vi'});return;}
      write('saveRecruitmentCriteriaScopeMapping',{scopeType:scopeType,scopeValue:scopeValue,roundKey:$('rhmScopeRound').value,criteriaSetId:$('rhmScopeSet').value},'Đã gán bộ tiêu chí',loadScoring);
    }

    function deleteScopeMapping(id) {
      App.ui.confirm('Xóa phạm vi áp dụng này?',{title:'Xóa cấu hình'}).then(function(confirmed){if(confirmed)write('deleteRecruitmentCriteriaScopeMapping',{mappingId:id},'Đã xóa phạm vi',loadScoring);});
    }

    function saveCriteriaSet() {
      var name=String($('rhmSetName').value||'').trim();
      var lines=Array.prototype.slice.call(root.querySelectorAll('[data-set-criterion]:checked')).map(function(input){var host=input.closest('.rhm-config-line');return{criteriaId:input.value,weight:Number(host.querySelector('[data-set-weight]').value||0)};}).filter(function(item){return item.weight>0;});
      var total=lines.reduce(function(sum,item){return sum+item.weight;},0);
      if(!name){App.ui.alert('Nhập tên bộ tiêu chí.',{title:'Thiếu thông tin'});return;}
      if(!lines.length||Math.abs(total-100)>.01){App.ui.alert('Chọn tiêu chí và phân bổ tổng trọng số đúng 100%. Hiện tại: '+total+'%.',{title:'Trọng số chưa hợp lệ'});return;}
      var code='REC_SET_' + Date.now();
      App.ui.showWriteLoading();
      App.gas('saveRecruitmentCriteriaEntity',{entityType:'criteriaSet',record:{code:code,name:name,description:'Bộ tiêu chí dùng trong Tuyển dụng',scoreGroupId:(state.scoringConfig.scoreGroups[0]||{}).id||'',versionNo:1,status:'draft',totalWeightPercent:100,isActive:true}}).then(function(response){
        var saved=response.record||(response.data||{}).record||{};var setId=saved.id||saved.code||code;
        return lines.reduce(function(chain,line,index){return chain.then(function(){var criterion=(state.scoringConfig.criteria||[]).filter(function(item){return String(item.id||item.code)===String(line.criteriaId);})[0]||{};return App.gas('saveRecruitmentCriteriaEntity',{entityType:'criteriaSetItem',record:{criteriaSetId:setId,criteriaSetCode:saved.code||code,criteriaSetName:saved.name||name,criteriaId:criterion.id||line.criteriaId,criteriaCode:criterion.code||'',criteriaName:criterion.name||'',weightPercent:line.weight,sortOrder:(index+1)*10,isRequired:true,isActive:true}});});},Promise.resolve());
      }).then(function(){return App.ui.alert('Đã lưu bộ tiêu chí. Hãy phát hành bộ trước khi áp dụng cho một vòng.',{title:'Đã tạo bộ tiêu chí'});}).then(loadScoring)
        .catch(function(error){App.ui.alert(error.message||String(error),{title:'Không lưu được bộ tiêu chí'});})
        .finally(function(){App.ui.hideLoading();});
    }

    function publishSet(id) { write('publishRecruitmentCriteriaSet',{id:id},'Đã phát hành bộ tiêu chí',loadScoring); }

    function saveRoundMappings() {
      var controls=Array.prototype.slice.call(root.querySelectorAll('[data-round-mapping]'));
      App.ui.showWriteLoading();
      controls.reduce(function(chain,select){return chain.then(function(){return App.gas('saveRecruitmentRoundCriteriaMapping',{roundKey:select.dataset.roundMapping,criteriaSetId:select.value});});},Promise.resolve())
        .then(function(){return App.ui.alert('Đã lưu bộ tiêu chí áp dụng cho cả 3 vòng.',{title:'Đã cập nhật cấu hình chấm'});}).then(loadScoring)
        .catch(function(error){App.ui.alert(error.message||String(error),{title:'Không lưu được cấu hình'});})
        .finally(function(){App.ui.hideLoading();});
    }

    function openAssessment() {
      var candidate = state.detail && state.detail.candidate;
      if (!candidate) return;
      closeDrawer();
      App.modals.close(KEY, 'switch');
      App.lazy.ensureLoaded('candidate-assessment').then(function () {
        if (typeof window.openCandidateAssessmentModal === 'function') {
          window.openCandidateAssessmentModal({ applicationId: candidate.applicationId, roundKey: 'preliminary' });
        }
      }).catch(function (error) {
        App.ui.alert(error.message || String(error), { title: 'Không mở được phiếu Sơ vấn' });
      });
    }

    root.addEventListener('click', function (event) {
      var viewButton = event.target.closest('[data-rhm-view]');
      if (viewButton && root.contains(viewButton)) { event.preventDefault(); event.stopPropagation(); goView(viewButton.getAttribute('data-rhm-view')); return; }
      var subtabButton=event.target.closest('[data-subtab-group]');
      if(subtabButton){var group=subtabButton.dataset.subtabGroup,key=subtabButton.dataset.subtab;if(group==='campaign'){state.campaignTab=key;renderCampaigns();}else if(group==='intake'){state.intakeTab=key;renderIntake();}else if(group==='tools'){state.toolsTab=key;renderTools();}else if(group==='report'){state.reportTab=key;renderReports();}return;}
      var stageButton = event.target.closest('[data-stage]');
      if (stageButton) { state.stage = stageButton.dataset.stage || ''; renderPipeline(); return; }
      var candidateButton = event.target.closest('[data-open-candidate]');
      if (candidateButton) { openCandidate(candidateButton.dataset.openCandidate); return; }
      var interviewButton = event.target.closest('[data-open-interview]');
      if (interviewButton) { openCandidate(interviewButton.dataset.interviewApplication, interviewButton.dataset.openInterview); return; }
      var presetButton = event.target.closest('[data-preset]');
      if (presetButton) { saveJourney(presetButton.dataset.preset); return; }
      var actionButton = event.target.closest('[data-action]');
      if (!actionButton) return;
      var action = actionButton.dataset.action;
      if (action === 'reload') goView(state.view,true);
      else if (action === 'filter') {
        state.query = $('rhmSearch').value || '';
        state.position = $('rhmPosition').value || '';
        goView('pipeline', true);
      } else if (action === 'export') exportCandidates();
      else if (action === 'export-workflow') downloadPayload('exportCandidateWorkflowXlsx',{},'xuất Work Flow Excel','Không xuất được Work Flow');
      else if (action === 'choose-csv') { var fileInput=$('rhmCsvFile'); if(fileInput)fileInput.click(); }
      else if (action === 'import-csv') importCsv();
      else if (action === 'choose-source-import') { var importFile=$('rhmSourceImportFile'); if(importFile)importFile.click(); }
      else if (action === 'import-source-file') importSourceFile();
      else if (action === 'choose-pdf-files') { var pdfFiles=$('rhmPdfFiles'); if(pdfFiles)pdfFiles.click(); }
      else if (action === 'import-pdf-files') importPdfFiles();
      else if (action === 'promote-workflow') promoteWorkflow();
      else if (action === 'remove-workflow') removeWorkflowRows();
      else if (action === 'scan-duplicates') scanDuplicates();
      else if (action === 'load-more-duplicates') scanDuplicates({ append:true });
      else if (action === 'remove-duplicates') removeDuplicates();
      else if (action === 'preview-code-repair') previewCodeRepair();
      else if (action === 'apply-code-repair') applyCodeRepair();
      else if (action === 'save-source') saveSourceDefinition();
      else if (action === 'choose-source-file') { var sourceFile=$('rhmSourceHeaderFile'); if(sourceFile)sourceFile.click(); }
      else if (action === 'read-source-headers') readSourceHeaders();
      else if (action === 'save-department') saveDepartment();
      else if (action === 'sync-orders') syncAvailableOrders();
      else if (action === 'sync-v2-input') syncV2Input();
      else if (action === 'sync-form-results') syncFormResults();
      else if (action === 'load-scoring') loadScoring();
      else if (action === 'go-scoring') goView('scoring');
      else if (action === 'save-criterion') saveCriterion();
      else if (action === 'save-score-group') saveScoreGroup();
      else if (action === 'save-scope-mapping') saveScopeMapping();
      else if (action === 'delete-scope-mapping') deleteScopeMapping(actionButton.getAttribute('data-mapping-id'));
      else if (action === 'save-criteria-set') saveCriteriaSet();
      else if (action === 'publish-set') publishSet(actionButton.getAttribute('data-set-id'));
      else if (action === 'save-round-mappings') saveRoundMappings();
      else if (action === 'load-temporary-jd') loadTemporaryJd(false);
      else if (action === 'add-jd-group') { var groups=$('rhmTempJdGroups');if(groups){groups.insertAdjacentHTML('beforeend',jdGroupEditor({},groups.querySelectorAll('[data-jd-group]').length));renumberJdEditors();} }
      else if (action === 'remove-jd-group') { var jdGroup=actionButton.closest('[data-jd-group]');if(jdGroup){jdGroup.remove();renumberJdEditors();} }
      else if (action === 'add-jd-item') { var jdItems=actionButton.closest('[data-jd-group]').querySelector('[data-jd-items]');if(jdItems){jdItems.insertAdjacentHTML('beforeend',jdItemEditor({},jdItems.querySelectorAll('[data-jd-item]').length));renumberJdEditors();} }
      else if (action === 'remove-jd-item') { var jdItem=actionButton.closest('[data-jd-item]');if(jdItem){jdItem.remove();renumberJdEditors();} }
      else if (action === 'save-temp-jd') saveTemporaryJd();
      else if (action === 'cancel-temp-jd') { state.temporaryJdDraft=null;renderTemporaryJd(); }
      else if (action === 'edit-temp-jd') { state.temporaryJdDraft=((state.temporaryJd||{}).jds||[]).filter(function(item){return item.id===actionButton.dataset.jdId;})[0]||null;renderTemporaryJd(); }
      else if (action === 'assign-temp-jd') assignTemporaryJd();
      else if (action === 'load-report') loadReport(false);
      else if (action === 'reset-report-filters') resetReportFilters();
      else if (action === 'refresh-offers') { state.offerCenter=null; loadOfferCenter('', false); }
      else if (action === 'create-offer-documents') createOfferDocuments();
      else if (action === 'toggle-campaign') { state.campaignFormOpen = !state.campaignFormOpen; renderCampaigns(); }
      else if (action === 'edit-campaign') editCampaign(actionButton.getAttribute('data-campaign-code'));
      else if (action === 'create-campaign') createCampaign();
      else if (action === 'add-campaign-source') { var sourceRows=$('rhmCampaignSourceRows');if(sourceRows)sourceRows.insertAdjacentHTML('beforeend',campaignSourceRow({})); }
      else if (action === 'remove-campaign-source') { var sourceRow=actionButton.closest('[data-campaign-source-row]');var sourceList=$('rhmCampaignSourceRows');if(sourceRow&&sourceList&&sourceList.querySelectorAll('[data-campaign-source-row]').length>1)sourceRow.remove();else App.ui.alert('Nhu cầu cần giữ ít nhất một dòng nguồn.',{title:'Chưa thể xóa dòng nguồn'}); }
      else if (action === 'add-manual-row') $('rhmManualRows').insertAdjacentHTML('beforeend', manualRow());
      else if (action === 'remove-manual-row') { var manual = actionButton.closest('[data-manual-row]'); if (manual) manual.remove(); }
      else if (action === 'import-manual') importManual();
      else if (action === 'close-drawer') closeDrawer();
      else if (action === 'save-journey') saveJourney('');
      else if (action === 'transfer-candidate') transferCandidate();
      else if (action === 'open-preliminary') openAssessment();
      else if (action === 'add-reviewer') $('rhmReviewerRows').insertAdjacentHTML('beforeend', reviewerRow([], 'Người phỏng vấn'));
      else if (action === 'remove-reviewer') { var reviewer = actionButton.closest('[data-reviewer-row]'); if (reviewer) reviewer.remove(); }
      else if (action === 'new-schedule') { state.selectedInterviewId=''; renderDrawer(); }
      else if (action === 'save-schedule') saveSchedule();
    });

    root.addEventListener('change',function(event){
      if(event.target && event.target.id==='rhmCsvFile'){
        var file=event.target.files&&event.target.files[0];
        var summary=$('rhmCsvSummary');
        if(summary)summary.textContent=file?(file.name+' · '+Math.round(file.size/1024)+' KB'):'Chưa chọn file';
      }
    });

    root.addEventListener('change',function(event){
      if(event.target && event.target.id==='rhmReportPeriod'){
        captureReportFilters();
        renderReports();
        return;
      }
      if(event.target && event.target.id==='rhmTransferRequest'){
        var selectedCampaign=((state.data||{}).campaigns||[]).filter(function(item){return String(item.code||'')===String(event.target.value||'');})[0];
        var transferPosition=$('rhmTransferPosition');
        if(selectedCampaign&&transferPosition)transferPosition.value=selectedCampaign.position||'';
        return;
      }
      if(event.target && event.target.id==='rhmSourceName'){
        var sourceName=event.target.value;
        var sourceItem=((state.data||{}).sources||[]).filter(function(item){return normalize(item.name)===normalize(sourceName);})[0];
        state.sourceDefinitionDraft={sourceName:sourceName,mapping:sourceItem&&sourceItem.mapping?sourceItem.mapping:{}};
        renderTools();
        return;
      }
      if(event.target && event.target.id==='rhmSourceHeaderFile'){
        var sourceFile=event.target.files&&event.target.files[0];
        var sourceSummary=$('rhmSourceHeaderSummary');
        if(sourceSummary)sourceSummary.textContent=sourceFile?(sourceFile.name+' · '+Math.round(sourceFile.size/1024)+' KB'):'Chưa chọn file';
      }
      if(event.target && event.target.id==='rhmSourceImportFile'){
        var importFile=event.target.files&&event.target.files[0];
        var importSummary=$('rhmSourceImportSummary');
        if(importSummary)importSummary.textContent=importFile?(importFile.name+' · '+Math.round(importFile.size/1024)+' KB'):'Chưa chọn file';
      }
      if(event.target && event.target.id==='rhmPdfFiles'){
        var pdfList=Array.prototype.slice.call(event.target.files||[]);var pdfSummary=$('rhmPdfSummary');if(pdfSummary)pdfSummary.textContent=pdfList.length?(pdfList.length+' file · '+Math.round(pdfList.reduce(function(sum,file){return sum+file.size;},0)/1024)+' KB'):'Chưa chọn file';
      }
      if(event.target && event.target.id==='rhmOfferSheet'){
        state.offerCenter=null;
        loadOfferCenter(event.target.value, false);
      }
    });

    $('rhmDrawerBackdrop').addEventListener('click', closeDrawer);
    window.preloadCandidateManagementWorkspace = function () { return preloadWorkspace(); };
    window.openCandidateManagementModal = function (options) { return App.modals.open(KEY, options || {}); };
    App.modals.register(KEY, { root: root, onOpen: function () { state.view = 'today'; state.stage = ''; state.duplicateDetail=null; if(state.data && Date.now()-state.loadedAt<120000){render();}else{state.data=null;state.loadedViews={};load({view:'today'});} }, onClose: closeDrawer });
  })();
</script>

    <script>
      
  document.addEventListener("click", function (event) {
    var target = event.target && event.target.closest
      ? event.target.closest('[data-rhm-view="offers"], [data-preset="offer"], [data-preset="hired"], [data-action*="offer"]')
      : null;
    if (!target) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    App.ui.alert("Luồng Offer và nhận việc đang tạm khóa theo yêu cầu. Các phần Tuyển dụng còn lại vẫn hoạt động bình thường.", {
      title: "Chức năng đang tạm khóa"
    });
  }, true);
      window.addEventListener("DOMContentLoaded", function () {
        var params = Object.fromEntries(new URLSearchParams(window.location.search));
        if (typeof window.openCandidateManagementModal === "function") window.openCandidateManagementModal(params);
      });
    </script>
  </body>
</html>
